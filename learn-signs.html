    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
        }

        /* Iframe takes up entire viewport */
        #learn-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Premium floating back button */
        .kiosk-back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(26, 37, 64, 0.85); /* Semi-transparent navy */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .kiosk-back-btn:hover {
            background: #f97316; /* Kiosk accent orange */
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(249, 115, 22, 0.4);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .kiosk-back-btn:active {
            transform: translateY(0);
        }

        .kiosk-back-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
