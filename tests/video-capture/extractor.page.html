<!doctype html>
<html>
<head>
<meta charset="utf-8"><title>video-landmarks extractor check</title>
<!-- gesture-data.js's locateFile computes a PAGE-RELATIVE "js/lib/mediapipe/..." path,
     matching production where every page (index.html, gesture-training.html, ...) lives at
     repo root. This page lives under tests/video-capture/, so <base> makes relative URLs -
     including gesture-data.js's own, computed at runtime - resolve exactly as they would from
     a page served at http://localhost/SKR/, without touching gesture-data.js itself. -->
<base href="/SKR/">
</head>
<body>
<!-- Hidden video element gesture-data.js's setupMediaPipe()/init() looks up
     (getElementById("videoFeed") || getElementById("video")), exactly as the real recording
     screen does, so the extractor runs against the ONE real shared MediaPipe Hands instance.
     It is given a real, looping, playing clip (not a live camera) so runHandLoop's
     `readyState >= 2` gate is satisfied and hands.send() actually fires while the live loop
     is running - needed to verify the loop resumes (send-count check) after release(). -->
<video id="videoFeed" muted playsinline loop style="display:none"></video>

<script>
// Count Hands.prototype.send() calls before any Hands instance exists, so both the live
// runHandLoop's sends and the extractor's detector.detect() sends are observable from outside
// gesture-data.js's closure (no test-only hook needed inside it).
window._sendCount = 0;
window.__patchSendCounter = function (HandsClass) {
  const orig = HandsClass.prototype.send;
  HandsClass.prototype.send = function (input) {
    window._sendCount++;
    return orig.call(this, input);
  };
};
</script>
<script src="js/lib/mediapipe/hands.js"></script>
<script>window.__patchSendCounter(window.Hands);</script>
<script src="js/capture-core.js"></script>
<script src="js/gesture-data.js"></script>
<script src="js/video-landmarks.js"></script>
<script>
// Driven by extractor-check.mjs over CDP. Every function below returns a plain
// JSON-serializable value (Runtime.evaluate returnByValue).

// Loads a webm built by the driver with ffmpeg (the fixed recording, or its no-cues copy) from
// the temp folder into window.recBlob for runExtract(). The video is only read, never sent.
window.loadBlobFromUrl = async function (url) {
  const res = await fetch(url);
  window.recBlob = await res.blob();
  return window.recBlob.size;
};

// Sets up MediaPipe on the hidden #videoFeed element exactly as the real recording screen
// would (GestureDataRecorder.setupMediaPipe), then gives that element a real playing/looping
// clip so runHandLoop's readyState gate is satisfied and the live loop actually calls send().
window.setupMp = async function (clipUrl) {
  const video = document.getElementById('videoFeed');
  video.src = clipUrl;
  await new Promise((resolve, reject) => {
    video.addEventListener('loadeddata', resolve, { once: true });
    video.addEventListener('error', reject, { once: true });
  });
  await video.play();
  const ok = await window.GestureDataRecorder.setupMediaPipe(video);
  return { ok: !!ok };
};

// Runs one extractVideoLandmarks() pass over window.recBlob using a fresh createVideoDetector().
// opts: { inputWidth, inputHeight, abortAfterFrames }. Returns the full progressCalls array
// (not just its length) so the driver can assert both its count and that `done` never
// exceeds `total`.
window.runExtract = async function (opts) {
  opts = opts || {};
  const detector = await window.GestureDataRecorder.createVideoDetector();
  let controller = null;
  let signal;
  if (opts.abortAfterFrames) {
    controller = new AbortController();
    signal = controller.signal;
  }
  const progressCalls = [];
  const t0 = performance.now();
  try {
    const result = await window.VideoLandmarks.extractVideoLandmarks(window.recBlob, {
      detector,
      inputWidth: opts.inputWidth,
      inputHeight: opts.inputHeight,
      signal,
      onProgress: (done, total) => {
        progressCalls.push([done, total]);
        if (controller && done >= opts.abortAfterFrames) controller.abort();
      },
    });
    const totalMs = Math.round(performance.now() - t0);
    return { ok: true, result, totalMs, progressCalls };
  } catch (err) {
    const totalMs = Math.round(performance.now() - t0);
    return {
      ok: false,
      errorName: err && err.name,
      errorMessage: err && err.message,
      totalMs,
      progressCalls,
    };
  } finally {
    detector.release();
  }
};

// Check-page-level probe (fix round 1): opens a throwaway <video> on window.recBlob and
// reports whether its raw duration is Infinity, so the driver can assert the no-cues ffmpeg
// copy really took extractVideoLandmarks' Infinity-duration branch. Independent of
// extractVideoLandmarks' own (internal, unobservable from outside) video element; does not
// change extractVideoLandmarks' public return shape.
window.probeDuration = async function () {
  const v = document.createElement('video');
  v.muted = true;
  v.playsInline = true;
  const url = URL.createObjectURL(window.recBlob);
  v.src = url;
  await new Promise((resolve, reject) => {
    v.addEventListener('loadedmetadata', resolve, { once: true });
    v.addEventListener('error', reject, { once: true });
  });
  const isInfinite = !isFinite(v.duration);
  const durationRaw = String(v.duration);
  v.removeAttribute('src');
  v.load();
  URL.revokeObjectURL(url);
  return { isInfinite, durationRaw };
};

// Feeds an extractVideoLandmarks() result through GestureCaptureCore.segmentFrames() exactly
// as the offline-segmentation caller (a later task) will: hands.length > 0 => handPresent.
window.checkSegmentation = function (result) {
  const frames = result.frames.map((f) => ({ t: f.t, handPresent: f.hands.length > 0 }));
  const seg = window.GestureCaptureCore.segmentFrames(frames, { endMs: result.durationMs });
  return { ok: seg.ok, repsCount: seg.ok ? seg.reps.length : undefined, reason: seg.reason };
};

window.getSendCount = function () {
  return window._sendCount;
};

// Waits ms, then returns the send count observed at that point (used to check the live loop
// resumes and keeps calling hands.send() after release()).
window.waitAndGetSendCount = function (ms) {
  return new Promise((resolve) => setTimeout(() => resolve(window._sendCount), ms));
};
</script>
</body>
</html>
