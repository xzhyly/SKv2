<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Clips ✿ Sining Kamay</title>
  <!-- Admin only (accounts-quiz phase): a non-admin is sent to the dashboard before this page
       shows (js/sk-account.js adminPage()). The logged-in admin role is the only gate (no PIN). -->
  <script src="php/api/me.php"></script>
  <script src="js/sk-account.js"></script>
  <script>SKAccount.adminPage();</script>
  <!-- Avatar clips (avatar phase, docs/reports/2026-10-05-avatar-step1.md (f)): pick a sign, pick a
       video (or import a landmark JSON), extract pose + hands with MediaPipe Holistic (vendored,
       offline), trim, preview on the avatar, Save / Redo / Delete / Export JSON. Meant to be run on the laptop; the Pi only plays clips. The video
       never leaves the browser. Opened from Train Gestures; admin only (logged-in admin role). -->
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/gesture-training.css?v=1.0.10">
  <link rel="stylesheet" href="css/virtual-keyboard.css?v=1.0.5">
  <link rel="stylesheet" href="css/avatar-clips.css?v=1.0.3">
  <script src="js/lib/holistic/holistic.js" defer></script>
  <script src="js/video-landmarks.js" defer></script>
  <script src="js/avatar-rig.js" defer></script>
  <script src="js/avatar-clip.js" defer></script>
  <script src="js/avatar-retarget.js" defer></script>
  <script src="js/avatar-timeline.js" defer></script>
  <script src="js/avatar-renderer.js" defer></script>
  <script src="js/avatar-player.js" defer></script>
  <script src="js/avatar-extract.js" defer></script>
  <script src="js/avatar-clips-ui.js" defer></script>
  <script src="js/virtual-keyboard.js" defer></script>
</head>
<body>

<div id="ac-ui" class="active">
  <nav class="tr-nav ac-nav">
    <a href="gesture-training.html" class="tr-back ac-back">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 2L4 7l5 5"/></svg>
      Train Gestures
    </a>
    <h1 class="ac-title">Avatar clips</h1>
    <span class="ac-count" id="ac-count"></span>
  </nav>

  <main class="ac-main">
    <section class="ac-col ac-left">
      <input type="search" id="ac-search" class="ac-input" placeholder="Search signs…" autocomplete="off" aria-label="Search signs">
      <div class="ac-list-wrap">
        <div class="ac-list" id="ac-list" role="listbox" aria-label="Signs"></div>
        <!-- The bulk importer's candidate clips of the selected sign, over the sign list. -->
        <div class="ac-cands" id="ac-cands" role="region" aria-label="Candidates" hidden>
          <div class="ac-cands-head">
            <span class="ac-cands-title" id="ac-cands-title">Candidates</span>
            <button type="button" class="ac-btn ac-small" id="ac-cands-close">Close</button>
          </div>
          <div class="ac-cands-list" id="ac-cands-list"></div>
        </div>
      </div>
      <div class="ac-selected-row">
        <div class="ac-selected" id="ac-selected">Pick a sign.</div>
        <button type="button" class="ac-btn ac-small ac-cands-open" id="ac-cands-open" aria-controls="ac-cands" aria-expanded="false" disabled>Candidates (0)</button>
      </div>
      <div class="ac-row">
        <label class="ac-btn ac-choose" id="ac-choose" aria-disabled="true">
          Choose video…
          <input type="file" id="ac-file" accept="video/*" hidden disabled>
        </label>
        <label class="ac-btn ac-import" id="ac-import" aria-disabled="true">
          Import JSON…
          <input type="file" id="ac-json" accept=".json,application/json" hidden disabled>
        </label>
        <input type="text" id="ac-signer" class="ac-input ac-signer" placeholder="Signer ID, e.g. P03" maxlength="80" autocomplete="off" aria-label="Signer ID (optional)">
      </div>
      <progress id="ac-progress" class="ac-progress" value="0" max="1"></progress>
      <div class="ac-status" id="ac-status" role="status" aria-live="polite"></div>
    </section>

    <section class="ac-col ac-right">
      <div class="ac-toggle" role="group" aria-label="Stage view">
        <button type="button" class="ac-seg active" id="ac-view-video" aria-pressed="true">Video + skeleton</button>
        <button type="button" class="ac-seg" id="ac-view-avatar" aria-pressed="false">Avatar</button>
      </div>
      <div class="ac-stage" id="ac-stage">
        <canvas id="ac-video-canvas" width="472" height="268"></canvas>
        <canvas id="ac-avatar-canvas" width="472" height="268"></canvas>
        <video id="ac-video" muted playsinline hidden></video>
      </div>
      <div class="ac-trim" id="ac-trim">
        <canvas id="ac-trim-bars" width="472" height="56"></canvas>
        <div class="ac-trim-shade ac-trim-shade-l" id="ac-shade-l"></div>
        <div class="ac-trim-shade ac-trim-shade-r" id="ac-shade-r"></div>
        <div class="ac-handle ac-handle-l" id="ac-handle-l" role="slider" aria-label="Trim start" tabindex="0"></div>
        <div class="ac-handle ac-handle-r" id="ac-handle-r" role="slider" aria-label="Trim end" tabindex="0"></div>
      </div>
      <div class="ac-trim-row">
        <span class="ac-trim-label" id="ac-trim-label">No video yet</span>
        <button type="button" class="ac-btn ac-small" id="ac-export" disabled>Export JSON</button>
        <button type="button" class="ac-btn ac-small" id="ac-preview" disabled>▶ Preview</button>
      </div>
      <div class="ac-actions">
        <button type="button" class="ac-btn ac-delete" id="ac-delete" disabled>Delete</button>
        <button type="button" class="ac-btn ac-redo" id="ac-redo" disabled>Redo</button>
        <button type="button" class="ac-btn ac-save" id="ac-save" disabled>Save</button>
      </div>
    </section>
  </main>
</div>

<div id="sk-toast" role="status" aria-live="polite"></div>
</body>
</html>
