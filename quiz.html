<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Sining Kamay</title>
<!-- Quiz (accounts-quiz phase, docs/design/new-features-wireframe.html screens 1-4), for guests,
     users and admins: setup, 10 questions (Sign -> Text or Text -> Sign), result. Questions come from
     signs with an avatar clip in the chosen language (php/api/quiz.php; avatar only since the
     talk-turns-audio phase, as in Let's Talk). The score is saved only for a logged-in account. Logic: js/quiz-core.js
     (questions, scoring) and js/quiz-ui.js (screens, clips). -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/sk-pages.css">
<style>
  .setup { padding-top: 22px; gap: 14px; }
  .setup .lang-seg { width: 50%; }
  .setup-info { min-height: 22px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .setup-info.bad { color: #b91c1c; }
  .setup-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .setup-foot span { color: var(--muted); font-size: 15px; }
  .setup-foot .sk-btn { width: 260px; }

  .score-txt { min-width: 120px; text-align: right; font-weight: 700; font-size: 17px; }
  .prog { flex: none; display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 16px; }
  .pbar { flex: 1; height: 10px; background: #d8dee8; border-radius: 5px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: var(--orange); }
  .prompt { flex: none; font-size: 22px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prompt q { color: var(--orange-dark); }

  .clip { position: relative; background: #dfe5ee; border-radius: 10px; overflow: hidden; display: grid; place-items: center; }
  .clip canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  .clip .play {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border: 0; border-radius: 50%; background: rgba(26, 37, 64, 0.85); color: #fff;
    display: grid; place-items: center; cursor: pointer;
  }
  .clip.playing .play { display: none; }
  .clip .err { position: absolute; inset: auto 0 8px 0; text-align: center; font-size: 13px; color: var(--muted); }

  /* Sign -> Text */
  .s2t { flex: 1; min-height: 0; display: flex; gap: 16px; }
  .s2t .clip { width: 440px; flex: none; }
  .replay {
    position: absolute; right: 10px; bottom: 10px; height: 44px; padding: 0 14px; border: 0; border-radius: 22px;
    background: rgba(26, 37, 64, 0.85); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer;
  }
  .s2t-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .ch {
    flex: none; height: 64px; padding: 0 18px; border: 2px solid var(--border); border-radius: 10px; background: #fff;
    color: var(--navy); font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;
  }
  .ch .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--bg); color: var(--muted); display: grid; place-items: center; font-size: 14px; font-weight: 800; }
  .ch.ok, .vc.ok { border-color: var(--green); background: #e8f7ef; }
  .ch.bad, .vc.bad { border-color: var(--red); background: #fdecec; }
  .ch:disabled { cursor: default; color: var(--navy); }
  .mark { flex: none; display: inline-flex; }

  /* Text -> Sign */
  .t2s { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .vc { background: #fff; border: 2px solid var(--border); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .vc .clip { height: 268px; }
  .vc .choose {
    height: 48px; border: 2px solid var(--navy); border-radius: 8px; background: #fff; color: var(--navy);
    font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 8px;
  }
  .vc .choose:disabled { cursor: default; }
  .vc.ok .choose { border-color: var(--green); color: #15803d; }
  .vc.bad .choose { border-color: var(--red); color: #b91c1c; }
  .q-foot { margin-top: auto; flex: none; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .q-foot span { color: var(--muted); font-size: 15px; }
  .q-foot .sk-btn { width: 260px; }

  /* Result */
  .result { flex-direction: row; gap: 20px; }
  .res-score { width: 340px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; }
  .res-score .big { font-size: 64px; font-weight: 800; line-height: 1; }
  .res-score .sub { color: var(--muted); text-align: center; }
  .res-score .sk-btn { width: 260px; }
  .res-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

  /* Watch overlay */
  .overlay { position: fixed; inset: 0; z-index: 3000; background: rgba(15, 25, 45, 0.6); display: grid; place-items: center; }
  .overlay[hidden] { display: none; }
  .ov-card { width: 620px; background: #fff; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .ov-card .clip { height: 380px; }
  .ov-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 22px; font-weight: 800; }
</style>
<script src="php/api/me.php"></script>
<script src="js/sk-account.js"></script>
</head>
<body class="sk-page">
  <div class="sk-bar">
    <div class="sk-bar-side"><button type="button" class="sk-back" id="back-btn">&#8592; Home</button></div>
    <h1 class="sk-title" id="bar-title">QUIZ</h1>
    <div class="sk-bar-side right"><div id="acct"></div><div class="score-txt" id="score-txt" hidden></div></div>
  </div>

  <!-- 1. Setup -->
  <div class="sk-screen on" id="screen-setup">
    <div class="sk-body setup">
      <div class="sk-lbl">Mode</div>
      <div class="sk-seg" id="seg-mode">
        <button type="button" data-v="sign-to-text" class="on">Sign &#8594; Text</button>
        <button type="button" data-v="text-to-sign">Text &#8594; Sign</button>
      </div>
      <div class="sk-lbl">Language</div>
      <div class="sk-seg lang-seg" id="seg-lang">
        <button type="button" data-v="ESL">ESL</button>
        <button type="button" data-v="FSL" class="on">FSL</button>
      </div>
      <div class="sk-lbl">Category</div>
      <div class="sk-seg" id="seg-cat">
        <button type="button" data-v="letters">Letters</button>
        <button type="button" data-v="numbers">Numbers</button>
        <button type="button" data-v="words" class="on">Words</button>
        <button type="button" data-v="phrases">Phrases</button>
        <button type="button" data-v="mixed">All</button>
      </div>
      <div class="setup-info" id="setup-info" role="status"></div>
      <div class="setup-foot">
        <span id="setup-note"></span>
        <button type="button" class="sk-btn pri" id="start-btn" disabled>Start quiz</button>
      </div>
    </div>
  </div>

  <!-- 2. Question -->
  <div class="sk-screen" id="screen-question">
    <div class="sk-body">
      <div class="prog"><span id="prog-txt">1 / 10</span><div class="pbar"><i id="prog-bar"></i></div></div>
      <div class="prompt" id="prompt"></div>
      <div class="s2t" id="s2t" hidden>
        <div class="clip" id="s2t-clip"></div>
        <div class="s2t-side">
          <div id="s2t-choices" style="display:flex;flex-direction:column;gap:12px"></div>
          <button type="button" class="sk-btn pri" id="next-btn-s2t" style="margin-top:auto" disabled>Next &#8594;</button>
        </div>
      </div>
      <div class="t2s" id="t2s" hidden></div>
      <div class="q-foot" id="t2s-foot" hidden>
        <span>Tap a sign to watch it &middot; tap Choose to answer</span>
        <button type="button" class="sk-btn pri" id="next-btn-t2s" disabled>Next &#8594;</button>
      </div>
    </div>
  </div>

  <!-- 3. Result -->
  <div class="sk-screen" id="screen-result">
    <div class="sk-body result">
      <div class="sk-box res-score">
        <div class="big" id="res-big">0/10</div>
        <div class="sub" id="res-sub"></div>
        <button type="button" class="sk-btn pri" id="again-btn" style="margin-top:20px">Try again</button>
        <button type="button" class="sk-btn sec" id="new-btn">New quiz</button>
      </div>
      <div class="res-side">
        <div class="sk-note" id="res-note"></div>
        <div class="sk-lbl" id="missed-lbl">Missed</div>
        <div class="sk-box sk-list" id="missed-list"></div>
      </div>
    </div>
  </div>

  <!-- Watch the right sign (from the missed list) -->
  <div class="overlay" id="overlay" hidden>
    <div class="ov-card">
      <div class="ov-head"><span id="ov-title"></span><button type="button" class="sk-btn sec h44" id="ov-close">Close</button></div>
      <div class="clip" id="ov-clip"></div>
    </div>
  </div>

  <script src="js/avatar-rig.js"></script>
  <script src="js/avatar-clip.js"></script>
  <script src="js/avatar-retarget.js"></script>
  <script src="js/avatar-timeline.js"></script>
  <script src="js/avatar-renderer.js"></script>
  <script src="js/avatar-store.js"></script>
  <script src="js/avatar-player.js"></script>
  <script src="js/quiz-core.js"></script>
  <script src="js/quiz-ui.js"></script>
</body>
</html>
