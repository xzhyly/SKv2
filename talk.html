<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024, initial-scale=1.0, user-scalable=no">
<title>Let's Talk — Sining Kamay</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/virtual-keyboard.css">
<style>
  /* ── Reset ── */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    font-family:'Inter','Segoe UI',Arial,sans-serif;
    background:var(--bg);
  }

  /* ── Header ──
     Fixed/out-of-flow: the 90px header is part of the fixed 1024×600 total
     (see docs/ui-target/README.md's screen-by-screen breakdowns), not extra
     height stacked on top of it, so it overlays the top of whichever
     600px-tall screen is showing rather than adding to document height. */
  .talk-header{
    position:fixed;top:0;left:0;z-index:100;
    width:1024px;height:90px;
    background:var(--navy);
    display:flex;align-items:center;justify-content:center;
  }
  .talk-header h1{
    color:var(--surface);
    font-size:20px;font-weight:700;
    letter-spacing:1.5px;
  }

  /* ── Back button (header, top-left) ──
     Per docs/ui-target/README.md: pill, white at 12% opacity. Visible on
     who-first/signing/speaking; hidden on thread per the seeded decision in
     docs/system/DECISIONS.md ("no Back button on the thread screen").
     Absolutely positioned within the (already non-static) .talk-header so it
     never disturbs the title's centring. 44px height/min-width: README says
     "40px tall" for the status pill and implies a similar pill here, but the
     touch-target rule ("nothing tappable smaller than 44x44") wins for any
     actually-tappable element — see the matching note on .status-pill below
     and docs/system/DECISIONS.md. */
  .back-btn{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    min-width:44px;height:44px;padding:0 18px;
    display:flex;align-items:center;justify-content:center;
    border:none;border-radius:99px;
    background:rgba(255,255,255,0.12);
    color:var(--surface);
    font-family:inherit;font-size:16px;font-weight:600;
    cursor:pointer;
  }
  body[data-screen="thread"] .back-btn{display:none}

  /* ── Status pill (header, top-right) ──
     `.status-pill` alone renders nothing (display:none) — a real state
     exists only once `.listening` or `.typing` is applied, and
     setStatusPill() below guarantees the two are mutually exclusive by
     clearing both before adding one. Dot colour and label text are both
     driven purely by the class (no textContent writes), matching the
     attribute/class-only pattern showScreen() already established.
     Height: README's exact 40px. The project's >=44x44 touch-target floor
     does not apply here — this pill has no click handler, it's a purely
     informational state indicator, not a tappable control. See
     docs/system/DECISIONS.md for the corrected note (an earlier revision of
     this file bumped it to 44px by over-applying the tap-target rule). */
  .status-pill{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    display:none;align-items:center;gap:8px;
    height:40px;padding:0 16px;
    border-radius:99px;
    background:rgba(255,255,255,0.12);
  }
  .status-pill.listening,
  .status-pill.typing{display:flex}
  .status-dot{
    width:10px;height:10px;border-radius:50%;
    flex:0 0 auto;
  }
  .status-pill.listening .status-dot{background:var(--green)}
  .status-pill.typing .status-dot{background:var(--orange)}
  .status-text{
    color:var(--surface);font-size:16px;font-weight:700;letter-spacing:0.5px;
  }
  .status-text::before{content:''}
  .status-pill.listening .status-text::before{content:'LISTENING'}
  .status-pill.typing .status-text::before{content:'TYPING'}

  /* ── Persistent thread subtree ──
     One element, never duplicated per screen. Visibility/height keyed
     entirely off body[data-screen], matching Task 1's one-pattern rule
     (attribute selectors, no second toggling mechanism). Hidden on
     who-first (no conversation exists yet); 96px collapsed strip on
     signing/speaking per docs/system/DECISIONS.md; 320px on thread (see the
     comment on the height:320px rule below for why it is not the full
     90-to-600 span). Positioned fixed so the same element can overlay
     whichever .screen container is currently showing without living inside
     any one of them. */
  #thread{
    position:fixed;left:0;top:90px;width:1024px;
    background:var(--surface);
    overflow:hidden;
    z-index:60;
    display:none;
  }
  body[data-screen="signing"] #thread,
  body[data-screen="speaking"] #thread{
    display:block;height:96px;
    transition:height 140ms ease;
  }
  /* Fix A (review pass): a first-turn conversation has no messages yet, and
     the rule above still rendered #thread at a fixed 96px — a blank white
     band under the header with nothing in it, on the very first real screen
     a new user reaches. README's collapsed-strip description only ever
     described "the most recent message"; it never considered the case where
     there isn't one yet. Collapsed to 0 (no border, matching this element's
     own base rule, which sets none) whenever #thread-list holds no
     .bubble-row — the moment appendBubble() adds the first one, :has()
     re-matches and the 96px rule above takes over, with the same
     transition. Chromium (this kiosk's browser) has supported :has() since
     v105, well within what this project already assumes. */
  body[data-screen="signing"] #thread:not(:has(.bubble-row)),
  body[data-screen="speaking"] #thread:not(:has(.bubble-row)){
    height:0;border:none;
  }
  body[data-screen="thread"] #thread{
    /* Task 3: shrunk from Task 2's placeholder 510px (600-90, "no control
       panel yet") to 320px = 600 - 90 (header) - 190 (bottom control panel),
       per docs/ui-target/README.md "05 — The conversation": "Thread fills
       from y=90 down to the control panel", panel is "~190px". This is the
       chosen resolution to the #thread/control-panel overlap Task 3's brief
       flagged: shrink #thread's height (rather than leaving it full-height
       and relying on stacking order) so the two regions are geometrically
       disjoint — #thread now spans y=90..410, .control-panel spans
       y=410..600 — instead of merely relying on z-index to hide the seam.
       .control-panel below is still position:fixed with z-index higher than
       #thread's 60, matching the header's fixed pattern, as a second line of
       defense. */
    display:block;height:320px;
  }
  #thread-list{
    height:100%;overflow-y:auto;
    padding:12px 16px;
    display:flex;flex-direction:column;gap:16px;
  }
  /* Visible scrollbar (README "05": "a visible scrollbar on the right edge
     ... on a touchscreen the bar is the only thing that proves more exists
     above") — Chromium's default overlay scrollbar can be invisible until
     hovered, which a touchscreen kiosk with no cursor never triggers, so it
     is styled explicitly rather than left to the platform default. Colours
     from tokens.css only. */
  #thread-list::-webkit-scrollbar{width:8px}
  #thread-list::-webkit-scrollbar-track{background:var(--bg)}
  #thread-list::-webkit-scrollbar-thumb{
    background:var(--muted-light);border-radius:99px;
  }
  /* Top-fade mask (README "03"/"05": "a white-to-transparent fade across the
     top 26px says more exists above"). A fixed (non-scrolling) sibling of
     #thread-list rather than a ::before on it, so the fade stays pinned to
     the top of #thread's visible area regardless of scroll position — a
     ::before painted inside the scrolling list would scroll away with the
     content instead of staying put. #thread is already position:fixed, so
     it is this element's containing block. `transparent` is a CSS keyword,
     not a new hex literal; the opaque end uses --surface, matching the
     bubble/card background it is fading from. pointer-events:none so it
     never intercepts scroll/tap input meant for the thread beneath it. */
  .thread-fade{
    position:absolute;top:0;left:0;right:0;height:26px;
    background:linear-gradient(to bottom, var(--surface) 0%, transparent 100%);
    pointer-events:none;
    z-index:1;
  }

  /* ── Bubble shape ──
     Convention per docs/ui-target/README.md "05 — The conversation" /
     docs/system/DECISIONS.md: deaf person left/white/1px border, hearing
     person right/navy/white text. Task 4's appendBubble() will generate
     .bubble-row groups like the placeholders below. Radius 18px per the
     palette's bubble radius. min-width/min-height guarantee the 44x44 touch
     rule regardless of how short the message text is (bubbles aren't
     tappable in this design, but the done criteria hold every .bubble to
     the same floor as tappable elements, so it's satisfied either way). */
  .bubble-row{
    display:flex;flex-direction:column;max-width:640px;
  }
  .bubble-row.deaf{align-items:flex-start;align-self:flex-start}
  .bubble-row.hearing{align-items:flex-end;align-self:flex-end}
  .bubble-label{
    font-size:16px;color:var(--muted);margin-bottom:4px;padding:0 4px;
  }
  .bubble{
    display:flex;align-items:center;gap:8px;
    min-width:44px;min-height:44px;
    padding:14px 18px;
    border-radius:18px;
    font-size:16px;line-height:1.4;
  }
  .bubble.deaf{
    background:var(--surface);border:1px solid var(--border);color:var(--navy);
  }
  .bubble.hearing{
    background:var(--navy);border:1px solid var(--navy);color:var(--surface);
  }
  .bubble-icon{font-size:16px;flex:0 0 auto}

  /* ── Modal shell ──
     Fixed overlay + centred card, hidden unless body.modal-open. All three
     kinds — confirm (Task 5), idle/error (Task 6) — render real content
     into this same shell via renderConfirmModal()/renderIdleModal()/
     renderErrorModal() in <script> below; openModal() throws on any other
     kind (Fix 1). */
  #modal{
    position:fixed;top:0;left:0;width:1024px;height:600px;
    display:none;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,0.5);
    z-index:200;
  }
  body.modal-open #modal{display:flex}
  .modal-card{
    width:640px;max-width:90%;
    background:var(--surface);
    border-radius:16px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    padding:32px;
    text-align:center;
  }
  .modal-card h2{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:8px}
  .modal-card p{font-size:16px;color:var(--muted);line-height:1.5}

  /* ── Confirm modal content (Task 5) ──
     docs/ui-target/README.md "Confirm — no image, build from this": small
     muted label, recognised text 32px bold navy centred, orange "Add to
     Conversation" full card width, plain muted "Try again" beneath. Built by
     renderConfirmModal() below into the same .modal-card shell Task 2
     already sized (~640 wide, radius 16, shadow) — no new card, just its
     kind==="confirm" content. The Add-to-Conversation button here is this
     overlay's OWN one-orange-element (README's rule is scoped per visual
     layer; the modal sits above whichever screen is showing and does not
     add a second orange element to that screen's own audit — see
     docs/system/DECISIONS.md and this task's report for the reasoning). */
  .confirm-label{
    font-size:16px;color:var(--muted);margin-bottom:12px;
  }
  .confirm-text{
    font-size:32px;font-weight:700;color:var(--navy);line-height:1.3;
    margin-bottom:24px;
    /* Long typed/spoken text should wrap, not blow out the fixed-width card. */
    word-break:break-word;
  }
  .confirm-add-btn{
    display:block;width:100%;height:60px;
    border:none;border-radius:12px;
    background:var(--orange);color:var(--surface);
    font-family:inherit;font-size:18px;font-weight:700;
    cursor:pointer;
    margin-bottom:12px;
  }
  .confirm-try-again-btn{
    display:block;width:100%;height:44px;
    border:none;background:transparent;
    color:var(--muted);
    font-family:inherit;font-size:16px;font-weight:600;
    cursor:pointer;
  }

  /* ── Idle modal content (Task 6) ──
     docs/ui-target/README.md "Idle warning": "Still there?" 32px bold,
     "This conversation will end in", a countdown in 44px orange, an orange
     Continue button, a plain End Now beneath. Built by renderIdleModal()
     below into the same .modal-card shell as confirm/error — no new card.
     .idle-title/.idle-label use their own classes (not .modal-card h2/p)
     so this task's 32px/16px sizing doesn't fight the shell's generic
     20px h2 / 16px p defaults. */
  .idle-title{
    font-size:32px;font-weight:700;color:var(--navy);margin-bottom:8px;
  }
  .idle-label{
    font-size:16px;color:var(--muted);
  }
  .idle-countdown{
    font-size:44px;font-weight:700;color:var(--orange);
    margin:8px 0 24px;
  }
  .idle-continue-btn{
    display:block;width:100%;height:60px;
    border:none;border-radius:12px;
    background:var(--orange);color:var(--surface);
    font-family:inherit;font-size:18px;font-weight:700;
    cursor:pointer;
    margin-bottom:12px;
  }
  .idle-end-btn{
    display:block;width:100%;height:44px;
    border:none;background:transparent;
    color:var(--muted);
    font-family:inherit;font-size:16px;font-weight:600;
    cursor:pointer;
  }

  /* ── Error modal content (Fix C, review pass) ──
     docs/ui-target/README.md "Error states": same centred-card treatment,
     a plain sentence, one way out. Originally built as just the sentence +
     button, which reads as an afterthought next to Confirm (label → big
     text → button) and Idle (title → label → countdown → button) — both
     lead with a short bold heading. Error now matches that shape: heading
     (.error-heading, same 32px bold navy as .idle-title) → sentence beneath
     (.error-message, now 16px muted like .confirm-label/.idle-label, since
     the heading now carries the primary emphasis the sentence used to) →
     button. opts.heading/opts.message/opts.buttonLabel are always set via
     textContent (renderErrorModal() below), never interpolated into
     innerHTML. */
  .error-heading{
    font-size:32px;font-weight:700;color:var(--navy);
    margin-bottom:8px;
  }
  /* .error-heading is built as a <div> (not <h2>), same reason
     .idle-title above is a <div> — a `<h2 class="error-heading">` would
     lose to the shell's own `.modal-card h2{font-size:20px}` rule by
     specificity ((0,1,1) beats (0,1,0)), not just source order, since both
     rules match. Caught by measuring the rendered font-size, not assumed. */
  .error-message{
    font-size:16px;color:var(--muted);line-height:1.5;
    margin-bottom:24px;
  }
  .error-action-btn{
    display:block;width:100%;height:60px;
    border:none;border-radius:12px;
    background:var(--navy);color:var(--surface);
    font-family:inherit;font-size:18px;font-weight:700;
    cursor:pointer;
  }

  /* ── Icon tile ──
     Filled rounded square, ~96x96, radius 16, one centred white icon glyph.
     Used by Task 3's screen 02 cards (Sign Language / Speak or Type); no
     colour variant is baked in here beyond the default navy fill — the
     orange variant README specifies for the right-hand card is that
     caller's concern (an inline style or modifier class), not this shape's. */
  .icon-tile{
    width:96px;height:96px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    background:var(--navy);
  }
  .icon-tile-glyph{
    font-size:40px;line-height:1;color:var(--surface);
  }

  /* ── Screen containers ──
     Exactly one visible at a time, gated purely by body[data-screen].
     Each is pinned to the fixed kiosk size — no 100vw/100vh, no responsive
     units — and padded below the fixed header so placeholder content isn't
     hidden under it. Task 3 fills these in with real layout; for now each
     is a labelled placeholder so the state machine can be verified by
     hand. */
  .screen{
    display:none;
    width:1024px;height:600px;
    padding-top:90px;
    flex-direction:column;
    overflow:hidden;
  }
  body[data-screen="who-first"] #screen-who-first{display:flex}
  body[data-screen="signing"] #screen-signing{display:flex}
  body[data-screen="speaking"] #screen-speaking{display:flex}
  body[data-screen="thread"] #screen-thread{display:flex}

  /* Task 3: #thread sits collapsed (96px) over y=90..186 on signing/speaking
     (see the body[data-screen="signing"]/"speaking" #thread rule above) —
     `.screen`'s flat padding-top:90px isn't enough on those two screens, or
     their own content would render underneath the collapsed strip. Override
     just these two ids to clear y=186 instead. who-first (no #thread yet)
     and thread (#thread starts at y=90 same as the header-clearing value)
     both keep the base 90px from `.screen` above. */
  #screen-signing,
  #screen-speaking{
    padding-top:186px;
    align-items:center;
    transition:padding-top 140ms ease;
  }
  /* Fix A (review pass), continued: collapsing #thread's own height to 0
     above is not enough on its own — this rule's flat 186px (90 header + 96
     collapsed strip) would still reserve the strip's 96px as dead space at
     the top of the screen's own content even while #thread itself is 0
     tall. On the first turn (no #thread-list .bubble-row yet), fall back to
     the base .screen padding-top of 90px instead, so the camera/mic content
     actually moves up into the space the empty strip just gave back rather
     than leaving a second, content-side hole in its place. */
  body[data-screen="signing"]:not(:has(#thread .bubble-row)) #screen-signing,
  body[data-screen="speaking"]:not(:has(#thread .bubble-row)) #screen-speaking{
    padding-top:90px;
  }

  /* ── Task 3 orange audit ──
     "One orange element per screen, no exceptions" (README "Visual
     language" / docs/system/DECISIONS.md). Each screen's single element
     whose computed background-color resolves to var(--orange) (or its
     pressed variant, unused here):
       - #screen-who-first : .icon-tile.orange (the "Speak or Type" tile)
       - #screen-signing   : #stop-signing-btn ("Stop & Add to Conversation")
       - #screen-speaking  : #speaking-send ("Send" — stays orange even
         disabled, see its :disabled rule below; opacity, not a colour swap,
         is what "pale" means here, so the background-color audit still
         finds exactly one orange element in either state)
       - #screen-thread    : #turn-speak-btn ("Speak or Type")
     Nothing else in this file sets a background to var(--orange)/
     var(--orange-dark). (.speaking-input's focus ring is an orange
     *border*, not a background — irrelevant to this audit and explicitly
     called for by README "04 — Speak or type".) */

  /* ── Screen 02 — Who speaks first (docs/ui-target/README.md "02") ── */
  #screen-who-first{
    align-items:center;
    justify-content:center;
  }
  .who-first-heading{
    font-size:34px;font-weight:700;color:var(--navy);
    text-align:center;
    margin-bottom:32px;
  }
  .who-first-cards{
    display:flex;gap:40px;
  }
  .who-first-card{
    width:380px;height:280px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;
    background:var(--surface);
    border:1px solid var(--border);border-radius:12px;
    font-family:inherit;
    cursor:pointer;
  }
  .who-first-card-label{
    font-size:20px;font-weight:700;color:var(--navy);
  }
  .who-first-card-caption{
    font-size:16px;color:var(--muted);
  }
  /* Orange modifier for the "Speak or Type" tile — the ONE orange element
     on this screen (see the audit comment above). A modifier class, not a
     new hex: swaps .icon-tile's navy fill for the shared --orange token. */
  .icon-tile.orange{
    background:var(--orange);
  }
  .lang-toggle{
    display:flex;
    margin-top:32px;
    border:1px solid var(--border);border-radius:99px;
    overflow:hidden;
    background:var(--surface);
  }
  .lang-toggle-btn{
    min-width:120px;height:44px;
    padding:0 20px;
    border:none;background:transparent;
    font-family:inherit;font-size:16px;font-weight:600;color:var(--muted);
    cursor:pointer;
  }
  .lang-toggle-btn.active{
    background:var(--navy);color:var(--surface);
  }

  /* ── Screen 03 — Signing (docs/ui-target/README.md "03") ── */
  .camera-box{
    width:560px;height:300px;
    margin-top:16px;
    border-radius:12px;
    /* #16192a is README's own literal spec for the camera view's dark
       backdrop ("03 — Signing": "dark #16192a background") — an explicit,
       called-out exception to the tokens.css-only rule, not an accidental
       new hex. It belongs to the camera display itself, not the shared UI
       palette, so it is not added to tokens.css. */
    background:#16192a;
    position:relative;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .hand-skeleton{
    width:180px;height:180px;
  }
  .signing-caption-pill{
    position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    padding:8px 22px;
    border-radius:99px;
    /* Solid black at partial opacity, matching this file's existing
       rgba(0,0,0,…)/rgba(255,255,255,…) convention for translucent overlays
       (see #modal and .back-btn/.status-pill above) rather than a new hex. */
    background:rgba(0,0,0,0.7);
  }
  .signing-caption-pill span{
    color:var(--surface);font-size:20px;font-weight:700;
  }
  .stop-signing-btn{
    width:560px;height:68px;
    margin-top:14px;
    border:none;border-radius:12px;
    background:var(--orange);
    color:var(--surface);
    font-family:inherit;font-size:18px;font-weight:700;
    cursor:pointer;
  }

  /* ── Screen 04 — Speak or type (docs/ui-target/README.md "04") ──
     js/virtual-keyboard.js is now wired (Fix 2 — an earlier task dispatch
     had wrongly called it out of scope; see docs/system/DECISIONS.md). This
     row's resting position is unaffected by that; see the
     "Screen 04 keyboard-open layout" CSS block above for the
     body.keyboard-active overrides that apply only while the keyboard is
     raised. */
  /* Fake mic button (Task 5) — README "04": "Draw it with the keyboard
     raised and the microphone hidden," implying a microphone button exists
     in the non-keyboard state that the (not-yet-built) keyboard hides when
     raised. No real mic exists this phase (docs/system/DECISIONS.md "two
     fake buttons"); this stands in for it, sitting above the text field —
     the same general area the mic occupies before the keyboard covers it,
     per README's "the microphone button and its label return to their
     exact previous positions" note. Deliberately NOT orange: #speaking-send
     is this screen's one orange element (see the Task 3 orange-audit
     comment above) and this is a secondary/fake affordance, not the screen's
     main action. */
  .speaking-mic-row{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    margin-bottom:24px;
  }
  .speaking-mic-btn{
    width:72px;height:72px;border-radius:50%;
    border:none;
    background:var(--navy);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .speaking-mic-glyph{
    font-size:32px;line-height:1;
  }
  .speaking-mic-label{
    font-size:16px;color:var(--muted);
  }
  .speaking-input-row{
    display:flex;align-items:center;gap:20px;
    margin-top:32px;
  }
  .speaking-input{
    width:700px;height:64px;
    padding:0 20px;
    border:1px solid var(--border);border-radius:12px;
    background:var(--surface);
    font-family:inherit;font-size:18px;color:var(--navy);
    outline:none;
  }
  .speaking-input:focus{
    border:2px solid var(--orange);
  }
  .speaking-input::placeholder{
    color:var(--muted-light);
  }
  .speaking-send{
    width:180px;height:64px;
    border:none;border-radius:12px;
    background:var(--orange);
    color:var(--surface);
    font-family:inherit;font-size:18px;font-weight:700;
    cursor:pointer;
  }
  /* README "04": "Pale / disabled while the field is empty." Faded via
     opacity, not a colour swap, so background-color stays var(--orange) in
     both states — the orange-audit comment above counts this button once
     regardless of enabled/disabled state. */
  .speaking-send:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }

  /* ── Screen 05 — The conversation (docs/ui-target/README.md "05") ──
     Bottom control panel. position:fixed + its own z-index (higher than
     #thread's 60), matching the header's fixed pattern — see the comment on
     body[data-screen="thread"] #thread{height:320px} above for why this and
     #thread no longer overlap. Being a normal child of #screen-thread, it
     still shows/hides purely via that ancestor's body[data-screen] display
     toggle — no separate visibility rule needed here. */
  .control-panel{
    position:fixed;left:0;bottom:0;width:1024px;height:190px;
    z-index:70;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;
    padding:12px 24px;
    gap:10px;
  }
  .control-panel-label{
    font-size:16px;color:var(--muted);text-align:center;
  }
  .control-panel-buttons{
    display:flex;gap:16px;
  }
  .turn-btn{
    width:480px;height:62px;
    border:none;border-radius:12px;
    font-family:inherit;font-size:18px;font-weight:700;
    cursor:pointer;
  }
  .turn-btn-sign{
    background:var(--navy);color:var(--surface);
  }
  /* The ONE orange element on the thread screen (see the audit comment
     above). */
  .turn-btn-speak{
    background:var(--orange);color:var(--surface);
  }
  .end-conversation-btn{
    width:976px;height:60px;
    border:2px solid var(--red);border-radius:12px;
    background:var(--surface);color:var(--red);
    font-family:inherit;font-size:18px;font-weight:700;
    cursor:pointer;
  }

  /* ── Virtual keyboard (Fix 2) ──
     js/virtual-keyboard.js self-attaches to #speaking-input on focus (no
     manual "attach" call needed — see index.html for the same pattern).
     Its shared stylesheet (css/virtual-keyboard.css, linked in <head>
     above) carries `!important` overrides meant for pages of varying
     height; they would break this file's fixed no-scroll 1024×600 contract
     the moment the keyboard opens, so they are neutralized below. This
     block sits after that <link> in the cascade (inline <style> always
     follows <link> tags in <head>), so equal selector specificity here
     still wins by source order — no need to out-specificity it.
     Sizing (240px tall, bottom:-280px hidden / 0 shown, smaller key font)
     matches index.html's own 1024×600 override
     (index.html, `@media screen and (max-height: 620px)`, search
     `sk-keyboard-wrap`), applied here unconditionally rather than
     re-wrapped in that same media query: talk.html is never rendered at any
     size other than exactly 1024×600
     (docs/system/DECISIONS.md: "Every screen is fixed at 1024×600, not
     responsive, not a breakpoint" — this file has no other media query
     anywhere), so an unconditional rule matches this file's own established
     style more directly than reintroducing a breakpoint mechanism it
     otherwise never uses. */
  .sk-keyboard-wrap{
    height:240px;
    bottom:-280px;
    padding:8px 6px;
    gap:6px;
  }
  .sk-keyboard-wrap.show{
    bottom:0;
  }
  .sk-key{
    height:44px;font-size:16px;border-radius:6px;
  }
  .sk-key.ctrl,.sk-key.space,.sk-key.action,.sk-key.close{
    font-size:13px;
  }
  /* Neutralizes css/virtual-keyboard.css's
     `body.keyboard-active{padding-bottom:300px!important}` and
     `html.keyboard-active,body.keyboard-active{overflow-y:auto!important;
     height:auto!important}` — both would defeat the
     html,body{overflow:hidden} no-scroll contract at the top of this file.
     Same technique index.html uses for the same shared stylesheet. */
  body.keyboard-active{
    padding-bottom:0!important;
  }
  html.keyboard-active,
  body.keyboard-active{
    overflow-y:hidden!important;
    height:100%!important;
  }

  /* ── Screen 04 keyboard-open layout (Fix 2) ──
     docs/ui-target/README.md "04 — Speak or type": "Draw it with the
     keyboard raised and the microphone hidden... When the keyboard closes,
     the microphone button and its label return to their exact previous
     positions. No drift." CSS-only, scoped by body.keyboard-active +
     #screen-speaking, matching this file's no-JS-computed-positions pattern
     and index.html's own body.keyboard-active #ttsBody ... precedent for
     its voice screen (docs/system/UI-SURVEY-1024x600.md, finding 1).
     Hiding .speaking-mic-row removes it from #screen-speaking's flex-column
     flow entirely (flexbox does not collapse margins between siblings the
     way block flow does), which alone puts .speaking-input-row back at the
     top of the content area; the smaller margin-top below just makes that
     intentional and documented instead of incidental. The keyboard's top
     edge sits at y = 600 − 240 = 360 (see .sk-keyboard-wrap above);
     #screen-speaking's padding-top:186px is unchanged, so with this
     override the input row starts at y=186+16=202 and both it and the Send
     button (each 64px tall) end at y=266 — about 94px clear of the
     keyboard's top edge. See this fix pass's report for the actual
     measured (not just arithmetic) numbers.
     The keyboard itself is a temporary raised overlay, not part of this
     screen's resting layout — same shape as the confirm modal Task 5
     already resolved this exact tension for (see the "── Confirm modal
     content (Task 5) ──" comment above) — so its own colouring is not
     counted against this screen's one-orange-element audit; see
     docs/system/DECISIONS.md for the recorded rationale. */
  body.keyboard-active #screen-speaking .speaking-mic-row{
    display:none;
  }
  body.keyboard-active #screen-speaking .speaking-input-row{
    margin-top:16px;
  }
</style>
</head>
<body data-screen="who-first">

  <div class="talk-header">

    <h1>NEW CONVERSATION</h1>

  <!-- Persistent thread subtree (Task 2 interface note: the plan text calls
       this #thread-strip/#thread-full; built here as one single #thread
       element instead, per the task's own "Your Job" instructions — its
       collapsed-vs-full height is a CSS/data-screen concern on ONE node, not
       two nodes toggled by JS. See the CSS block above for the ids Task 4/
       Task 3 should target: #thread (persistent container) and #thread-list
       (inner scrollable list Task 4's appendBubble() appends into).
       Task 2/3's placeholder bubble-rows (used to measure the 96px/320px
       thread heights by hand) are gone now that Task 4's appendBubble()
       below is the real way bubbles get into this list — #thread-list
       starts empty; nothing populates it until a caller appends. -->
  <div id="thread">
    <div id="thread-list"></div>

  <!-- Screen 02 — docs/ui-target/README.md "02 — Who speaks first". Shown
       once at the start of a conversation only (docs/system/DECISIONS.md);
       turn 2+ routes through #screen-thread's own control panel instead. -->
  <div class="screen" id="screen-who-first">
    <h2 class="who-first-heading">Who speaks first?</h2>
    <div class="who-first-cards">
      <button type="button" class="who-first-card" id="card-sign">

        <div class="who-first-card-label">Sign Language</div>

        <div class="who-first-card-label">Speak or Type</div>
        <div class="who-first-card-caption">Use your voice or the keyboard</div>

    <!-- English/Filipino toggle (Task 3 interface note: value read by later

    <div class="lang-toggle" id="lang-toggle" data-lang="en">
      <button type="button" class="lang-toggle-btn active" data-lang-value="en">English</button>
      <button type="button" class="lang-toggle-btn" data-lang-value="fil">Filipino</button>
    </div>
  </div>

  <!-- Screen 03 — docs/ui-target/README.md "03 — Signing". The collapsed
       #thread strip above already applies via this container's own
       data-screen="signing" CSS (Task 2); nothing here needs to touch it. -->
  <div class="screen" id="screen-signing">
    <div class="camera-box">
      <!-- Static hand-skeleton illustration only — no real MediaPipe
           drawing (that's a later, real-integration phase). -->
      <svg class="hand-skeleton" viewBox="0 0 200 220" aria-hidden="true">
        <g fill="none" stroke="var(--surface)" stroke-width="3" stroke-linecap="round" opacity="0.85">
          <line x1="100" y1="140" x2="60" y2="60"/>
          <line x1="100" y1="140" x2="80" y2="40"/>
          <line x1="100" y1="140" x2="100" y2="30"/>
          <line x1="100" y1="140" x2="120" y2="40"/>
          <line x1="100" y1="140" x2="138" y2="70"/>
          <polygon points="60,140 100,150 140,140 130,190 70,190" stroke="none" fill="var(--surface)" opacity="0.25"/>
        </g>
        <g fill="var(--surface)">
          <circle cx="100" cy="140" r="5"/>
          <circle cx="60" cy="60" r="5"/>
          <circle cx="80" cy="40" r="5"/>
          <circle cx="100" cy="30" r="5"/>

        </g>
      </svg>
      <!-- Live recognition caption — README "03": not decoration, tells the
           signer what the system is reading as they sign. Static placeholder
           word for this fake-data phase; Task 5 wires the real value. -->
      <div class="signing-caption-pill"><span id="signing-caption">HELLO</span></div>
    </div>
    <!-- Stands in for the classifier's confirm step, per
         docs/system/DECISIONS.md's "two fake buttons" note — wired (Task 5)
         to openModal('confirm', ...) with a canned result, never straight to
         appendBubble(). See the click handler near the bottom of this
         file's <script>. -->
    <button type="button" class="stop-signing-btn" id="stop-signing-btn">Stop &amp; Add to Conversation</button>
  </div>

  <!-- Screen 04 — docs/ui-target/README.md "04 — Speak or type". Keyboard
       (js/virtual-keyboard.js) is out of scope for this task — see the
       .speaking-input-row CSS comment above for how the layout leaves room
       for it. -->
  <div class="screen" id="screen-speaking">
    <!-- Fake mic button (Task 5) — stands in for real speech capture, which
         doesn't exist this phase (docs/system/DECISIONS.md's "two fake
         buttons" note). Wired below to openModal('confirm', ...) with a
         canned result, same as the signing screen's Stop button. -->
    <div class="speaking-mic-row">
      <button type="button" id="speaking-mic-btn" class="speaking-mic-btn" aria-label="Tap to speak">
        <span class="speaking-mic-glyph" aria-hidden="true">&#127908;</span>
      </button>
      <div class="speaking-mic-label">Tap to speak</div>
    </div>
    <div class="speaking-input-row">
      <input type="text" id="speaking-input" class="speaking-input" placeholder="Type your message" autocomplete="off">
      <button type="button" id="speaking-send" class="speaking-send" disabled>Send</button>
    </div>
  </div>

  <!-- Screen 05 — docs/ui-target/README.md "05 — The conversation". The
       thread itself is #thread above (persistent, Task 2); this container
       only adds the bottom control panel. -->
  <div class="screen" id="screen-thread">
    <div class="control-panel">
      <div class="control-panel-label">Whose turn is it?</div>
      <div class="control-panel-buttons">
        <button type="button" class="turn-btn turn-btn-sign" id="turn-sign-btn">Sign</button>
        <button type="button" class="turn-btn turn-btn-speak" id="turn-speak-btn">Speak or Type</button>
      </div>
      <!-- Real navigation per docs/system/DECISIONS.md ("End Conversation is
           a real page load back to index.html, not a hide") — calls the
           already-defined empty onEndConversation() hook, then leaves the
           page for real. Camera/speech teardown itself is a later phase's
           job, not this task's. -->
      <button type="button" class="end-conversation-btn" id="end-conversation-btn">End Conversation</button>
    </div>
  </div>

  <!-- Modal shell (Task 2): fixed overlay + centred card, hidden unless
       body.modal-open. data-modal-kind is set by openModal() below so
       confirm/idle/error content is keyed off it. -->
  <!-- Empty by default — openModal() always rebuilds .modal-card's content
       (renderConfirmModal()/renderIdleModal()/renderErrorModal(), all
       below) before showing the overlay, so there is nothing static to put
       here; the Task 2 placeholder markup this held is gone now that all
       three real kinds have real render functions (Fix 1). -->
  <div id="modal">
    <div class="modal-card"></div>
  </div>

  <script src="js/virtual-keyboard.js" defer></script>
  <script>
    'use strict';

    // ── Task 6: idle timer ──
    // Configurable top-of-script constant, read once by startIdleTimer()
    // below — kept separate from the trigger logic itself so this task's own
    // verification can temporarily shorten it (e.g. to 50ms) without editing
    // anything else. Production value: 2 minutes, per
    // docs/ui-target/README.md "Idle warning": "Appears after two minutes
    // without input."
    const IDLE_TIMEOUT_MS = 120000; // 2 minutes, production value (see comment above)

    var VALID_SCREENS = ['who-first', 'signing', 'speaking', 'thread'];

    // Empty hooks — a later phase attaches camera start/MediaPipe setup here.
    function onEnterSigning() {}
    // Empty hook — a later phase attaches camera stop/frame-loop teardown here.
    function onLeaveSigning() {}
    // Empty hook — a later phase attaches Vosk model start/mic capture here.
    function onEnterSpeaking() {}
    // Empty hook — a later phase attaches Vosk stop/mic teardown here.
    function onLeaveSpeaking() {}
    // Empty hook — a later phase attaches full teardown then location.href
    // navigation back to index.html here (see docs/ui-target/README.md,
    // "End Conversation must be a real teardown").
    function onEndConversation() {}

    /**
     * Show one of the four screens by name. Pure attribute-change: no
     * innerHTML rebuild, and the onEnter/onLeave hooks only fire on an
     * actual transition — calling showScreen() again with the screen
     * already active is a no-op past the validation/diff check.
     */
    function showScreen(name) {
      if (VALID_SCREENS.indexOf(name) === -1) {
        throw new Error('showScreen: invalid screen name "' + name + '"');
      }

      var previous = document.body.dataset.screen;
      if (previous === name) {
        return;
      }

      if (previous === 'signing') {
        onLeaveSigning();
      } else if (previous === 'speaking') {
        onLeaveSpeaking();
      }

      if (name === 'signing') {
        onEnterSigning();
      } else if (name === 'speaking') {
        onEnterSpeaking();
      }

      document.body.dataset.screen = name;
    }

    // Back button (header, top-left): visible on who-first/signing/speaking
    // (hidden on thread by the CSS rule Task 2 already wrote). Fix 3: routes
    // to 'thread' when at least one message already exists — per
    // docs/system/DECISIONS.md, "Who speaks first?" (who-first) is shown
    // once at the start of a conversation only, and turn 2+ reaches
    // signing/speaking through the thread screen's own Sign/Speak-or-Type
    // buttons, not through who-first. Routing Back to who-first
    // unconditionally would strand an in-progress conversation behind a
    // screen where #thread is display:none. On turn 1 (no messages yet,
    // reached directly from who-first), the thread has no .bubble-row yet,
    // so this still falls through to who-first, matching the original
    // behaviour. Existence check uses the same .bubble-row class
    // appendBubble() builds each bubble's row wrapper with (see
    // appendBubble() below). Tapping Back while already on the resulting
    // screen is a harmless no-op either way (showScreen() returns early for
    // a same-screen call).
    document.getElementById('backBtn').addEventListener('click', function () {
      var hasMessages = document.querySelector('#thread-list .bubble-row') !== null;
      showScreen(hasMessages ? 'thread' : 'who-first');
    });

    var VALID_STATUS_KINDS = ['listening', 'typing'];

    /**
     * Show/hide the header status pill. kind is null (render nothing),
     * "listening", or "typing" — never both: both state classes are always
     * cleared first, so applying one is the only way either appears. Pure
     * class change, no textContent writes (dot colour and label text are
     * both driven by CSS off the class — see .status-pill rules above).
     */
    function setStatusPill(kind) {
      var pill = document.getElementById('statusPill');
      pill.classList.remove('listening', 'typing');
      if (kind === null) {
        return;
      }
      if (VALID_STATUS_KINDS.indexOf(kind) === -1) {
        throw new Error('setStatusPill: invalid kind "' + kind + '"');
      }
      pill.classList.add(kind);
    }

    /**
     * Build the confirm modal's real content (Task 5) into .modal-card:
     * a small muted label, the recognised text large/bold/centred, an
     * orange full-width "Add to Conversation" button, and a plain "Try
     * again" button beneath it. Built via createElement/textContent (never
     * innerHTML with interpolated data) so opts.text — real typed user
     * input on the Send path — is never parsed as markup.
     *
     * "Add to Conversation" is the ONLY real call site of appendBubble() in
     * this file (grepped and confirmed — see the comment at appendBubble's
     * declaration above and this task's report).
     *
     * @param {{label: string, text: string, from: 'deaf'|'hearing'}} opts
     */
    function renderConfirmModal(opts) {
      opts = opts || {};
      var card = document.querySelector('.modal-card');
      card.innerHTML = '';

      var label = document.createElement('p');
      label.className = 'confirm-label';
      label.textContent = opts.label || '';
      card.appendChild(label);

      var text = document.createElement('div');
      text.className = 'confirm-text';
      text.textContent = opts.text || '';
      card.appendChild(text);

      var addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'confirm-add-btn';
      addBtn.textContent = 'Add to Conversation';
      addBtn.addEventListener('click', function () {
        appendBubble({ from: opts.from, text: opts.text, timestamp: new Date() });
        closeModal();
        showScreen('thread');
      });
      card.appendChild(addBtn);

      var tryAgainBtn = document.createElement('button');
      tryAgainBtn.type = 'button';
      tryAgainBtn.className = 'confirm-try-again-btn';
      tryAgainBtn.textContent = 'Try again';
      tryAgainBtn.addEventListener('click', function () {
        // Returns to whichever screen opened it — no showScreen() call
        // needed, that screen is already showing underneath the overlay.
        closeModal();
      });
      card.appendChild(tryAgainBtn);
    }

    // Holds the running idle-countdown setInterval id (Task 6), or null when
    // no idle modal is showing. Module-level rather than local to
    // renderIdleModal() so closeModal() below can defensively clear it too —
    // Continue/End Now/countdown-reaches-0 all clear it themselves on their
    // own exit paths, but closeModal() also covers any other way the modal
    // shell gets hidden, so no dangling interval can ever keep ticking
    // after the overlay is gone.
    var idleCountdownIntervalId = null;

    /**
     * Build the idle-warning modal's real content (Task 6) into
     * .modal-card: "Still there?" (32px bold), the "will end in" label, a
     * 44px orange countdown that decrements once per second, an orange
     * "Continue" button, and a plain "End Now" button beneath — per
     * docs/ui-target/README.md "Idle warning". Built via
     * createElement/textContent, matching renderConfirmModal()'s pattern
     * above (no innerHTML rebuild with interpolated content — there is none
     * here, but the pattern is kept consistent regardless).
     *
     * If the countdown reaches 0 with nobody answering, it behaves exactly
     * like "End Now" — clears the interval, calls onEndConversation(), then
     * navigates, same order as the real End Conversation button
     * (docs/ui-target/README.md: "ends the conversation by itself if nobody
     * answers").
     *
     * @param {{seconds: number}} opts
     */
    function renderIdleModal(opts) {
      opts = opts || {};
      var card = document.querySelector('.modal-card');
      card.innerHTML = '';

      var title = document.createElement('div');
      title.className = 'idle-title';
      title.textContent = 'Still there?';
      card.appendChild(title);

      var label = document.createElement('p');
      label.className = 'idle-label';
      label.textContent = 'This conversation will end in';
      card.appendChild(label);

      var countdown = document.createElement('div');
      countdown.className = 'idle-countdown';
      var secondsLeft = typeof opts.seconds === 'number' ? opts.seconds : 30;
      countdown.textContent = String(secondsLeft);
      card.appendChild(countdown);

      if (idleCountdownIntervalId !== null) {
        clearInterval(idleCountdownIntervalId);
      }
      idleCountdownIntervalId = setInterval(function () {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          clearInterval(idleCountdownIntervalId);
          idleCountdownIntervalId = null;
          onEndConversation();
          location.href = 'index.html';
          return;
        }
        countdown.textContent = String(secondsLeft);
      }, 1000);

      var continueBtn = document.createElement('button');
      continueBtn.type = 'button';
      continueBtn.className = 'idle-continue-btn';
      continueBtn.textContent = 'Continue';
      continueBtn.addEventListener('click', function () {
        clearInterval(idleCountdownIntervalId);
        idleCountdownIntervalId = null;
        closeModal();
        resetIdleTimer();
      });
      card.appendChild(continueBtn);

      var endNowBtn = document.createElement('button');
      endNowBtn.type = 'button';
      endNowBtn.className = 'idle-end-btn';
      endNowBtn.textContent = 'End Now';
      endNowBtn.addEventListener('click', function () {
        clearInterval(idleCountdownIntervalId);
        idleCountdownIntervalId = null;
        onEndConversation();
        location.href = 'index.html';
      });
      card.appendChild(endNowBtn);
    }

    /**
     * Build the error modal's real content (Fix C, review pass) into
     * .modal-card: a short bold heading (opts.heading), a sentence beneath
     * it (opts.message), then exactly one button whose label/action the
     * caller supplies (opts.buttonLabel/opts.onAction), falling back to
     * closeModal() if no onAction is given. Same shape as Confirm/Idle —
     * heading first — so Error reads as the same family of card, not an
     * afterthought. All three strings go through textContent, never
     * interpolated into innerHTML. Not wired to any real failure condition
     * this phase (no camera/mic exists yet to fail) — this is the reusable
     * shell a later phase calls into, per docs/ui-target/README.md "Error
     * states".
     *
     * @param {{heading: string, message: string, buttonLabel: string, onAction: Function}} opts
     */
    function renderErrorModal(opts) {
      opts = opts || {};
      var card = document.querySelector('.modal-card');
      card.innerHTML = '';

      var heading = document.createElement('div');
      heading.className = 'error-heading';
      heading.textContent = opts.heading || '';
      card.appendChild(heading);

      var message = document.createElement('p');
      message.className = 'error-message';
      message.textContent = opts.message || '';
      card.appendChild(message);

      var actionBtn = document.createElement('button');
      actionBtn.type = 'button';
      actionBtn.className = 'error-action-btn';
      actionBtn.textContent = opts.buttonLabel || 'OK';
      actionBtn.addEventListener('click', function () {
        if (typeof opts.onAction === 'function') {
          opts.onAction();
        } else {
          closeModal();
        }
      });
      card.appendChild(actionBtn);
    }

    var VALID_MODAL_KINDS = ['confirm', 'idle', 'error'];

    /**
     * Open the modal shell with a given kind ("confirm"/"idle"/"error") and
     * the data it needs to render. Sets data-modal-kind on #modal, dispatches
     * to the matching content-render step, then reveals the overlay via
     * body.modal-open (pure class change).
     *
     * Throws on any kind other than the three real ones, matching the
     * pattern showScreen() above already established (validate up front,
     * throw rather than silently no-op) — now that Fix 1 has removed the
     * catch-all renderPlaceholderModal() fallback, every kind this function
     * accepts has real content. To eyeball the "error" kind by hand (it has
     * no real trigger yet this phase — no camera/mic exists to fail), call
     * it directly from the browser console, e.g.:
     *   openModal('error', {message: 'I cannot reach the camera.', buttonLabel: 'Try again'})
     *
     * @param {string} kind
     * @param {{label: string, text: string, from: 'deaf'|'hearing'}|{seconds: number}|{message: string, buttonLabel: string, onAction: Function}} [opts]
     *   Shape depends on kind — see renderConfirmModal()/renderIdleModal()/
     *   renderErrorModal() above.
     */
    function openModal(kind, opts) {
      if (VALID_MODAL_KINDS.indexOf(kind) === -1) {
        throw new Error('openModal: invalid modal kind "' + kind + '"');
      }

      document.getElementById('modal').setAttribute('data-modal-kind', kind);
      if (kind === 'confirm') {
        renderConfirmModal(opts);
      } else if (kind === 'idle') {
        renderIdleModal(opts);
      } else {
        renderErrorModal(opts);
      }
      document.body.classList.add('modal-open');
    }

    /**
     * Hide the modal shell. Leaves data-modal-kind/.modal-card content as-is
     * (harmless while hidden). Also defensively clears any running idle
     * countdown (Task 6) — see the comment on idleCountdownIntervalId above
     * for why this lives here too, not just in the idle modal's own
     * Continue/End Now handlers.
     */
    function closeModal() {
      document.body.classList.remove('modal-open');
      if (idleCountdownIntervalId !== null) {
        clearInterval(idleCountdownIntervalId);
        idleCountdownIntervalId = null;
      }
    }

    // ── Task 4: The persistent thread — appendBubble() ──
    // #thread-list starts empty (Task 2/3's placeholder bubble-rows are
    // gone); appendBubble() below is the only way bubbles get into it, from
    // this task onward.

    var THREAD_BUBBLE_CAP = 30;

    // Icon-per-side convention, per docs/ui-target/README.md "05": a
    // speaker icon on every white/.bubble.deaf bubble (signed messages are
    // also spoken aloud automatically), a hand icon on every navy/
    // .bubble.hearing bubble (tapping replays it as signs — wiring that tap
    // handler is a later task's job, not this one's).
    var BUBBLE_ICON = {
      deaf: '\u{1F50A}',
      hearing: '✋'
    };
    var BUBBLE_LABEL_VERB = { deaf: 'Signed', hearing: 'Spoken' };

    /**
     * Format a Date (or anything `new Date()` accepts) as "h:mm AM/PM" — no
     * leading zero on the hour, per the existing `Signed · 10:41` bubble-
     * label convention this codebase already used (Task 2's now-removed
     * placeholder), with AM/PM appended per the task brief's "10:02 AM"
     * example.
     */
    function formatBubbleTime(timestamp) {
      var d = (timestamp instanceof Date) ? timestamp : new Date(timestamp);
      var hours = d.getHours();
      var minutes = d.getMinutes();
      var period = hours >= 12 ? 'PM' : 'AM';
      var h12 = hours % 12;
      if (h12 === 0) h12 = 12;
      var mm = minutes < 10 ? '0' + minutes : String(minutes);
      return h12 + ':' + mm + ' ' + period;
    }

    /**
     * Append one message bubble to the persistent thread. Builds the exact
     * .bubble-row > (.bubble-label + .bubble.<from> > (.bubble-icon +
     * .bubble-text)) DOM shape Task 2/3 established, via appendChild only —
     * never innerHTML — since the thread is persistent across screen
     * changes, not rebuilt. Scrolls #thread-list to the newest bubble, then
     * trims the list to the last 30 .bubble-row children via real DOM
     * removal (README: "cap the thread at roughly the last 30 bubbles in
     * the DOM" — older messages still live in the database, just not here).
     *
     * @param {{from: 'deaf'|'hearing', text: string, timestamp: (Date|*)}} msg
     *
     * Task 5 note: grepped the finished file for `appendBubble(` — 2 matches
     * total: this declaration, and the one real call site inside
     * renderConfirmModal()'s "Add to Conversation" button handler above.
     * Nothing else in this file calls appendBubble() directly; the signing
     * Stop button, the speaking screen's fake mic button, and Send all route
     * through openModal('confirm', ...) first, per
     * docs/system/DECISIONS.md's "nothing enters the thread without passing
     * through Confirm."
     */
    function appendBubble(msg) {
      var from = msg.from;
      if (from !== 'deaf' && from !== 'hearing') {
        throw new Error('appendBubble: invalid from "' + from + '"');
      }

      var row = document.createElement('div');
      row.className = 'bubble-row ' + from;

      var label = document.createElement('div');
      label.className = 'bubble-label';
      label.textContent = BUBBLE_LABEL_VERB[from] + ' · ' + formatBubbleTime(msg.timestamp);
      row.appendChild(label);

      var bubble = document.createElement('div');
      bubble.className = 'bubble ' + from;

      var icon = document.createElement('span');
      icon.className = 'bubble-icon';
      icon.textContent = BUBBLE_ICON[from];

      var text = document.createElement('span');
      text.className = 'bubble-text';
      text.textContent = msg.text;

      // Icon-before-text on .bubble.deaf, text-before-icon on
      // .bubble.hearing — matches the DOM order of the placeholder markup
      // this replaced (speaker icon led the white bubble; hand icon
      // trailed the navy one).
      if (from === 'deaf') {
        bubble.appendChild(icon);
        bubble.appendChild(text);
      } else {
        bubble.appendChild(text);
        bubble.appendChild(icon);
      }
      row.appendChild(bubble);

      var list = document.getElementById('thread-list');
      list.appendChild(row);

      // Cap enforcement runs before the scroll-to-newest assignment below:
      // pruning changes list.scrollHeight (removing rows from the top
      // shortens it), so scrollTop must be computed against the
      // already-pruned list, not the pre-prune one — otherwise the final
      // scrollTop would be stale relative to the list's actual (post-cap)
      // scrollHeight/clientHeight.
      while (list.querySelectorAll('.bubble-row').length > THREAD_BUBBLE_CAP) {
        list.removeChild(list.firstElementChild);
      }

      list.scrollTop = list.scrollHeight;
    }

    // ── Screen 02 — Who speaks first ──
    // Card taps choose who starts; per docs/system/DECISIONS.md this screen
    // is shown once only, so these are the only two places 'signing'/
    // 'speaking' are entered from outside the thread's own control panel.
    document.getElementById('card-sign').addEventListener('click', function () {
      showScreen('signing');
    });
    document.getElementById('card-speak').addEventListener('click', function () {
      showScreen('speaking');
    });

    // English/Filipino toggle: purely visual + attribute state in this
    // fake-data phase (Task 3 interface note: "value read by later tasks
    // but not acted on"). data-lang on #lang-toggle is what a later task
    // reads; the .active class is just which button looks selected.
    document.getElementById('lang-toggle').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-lang-value]');
      if (!btn) return;
      var toggle = document.getElementById('lang-toggle');
      toggle.setAttribute('data-lang', btn.getAttribute('data-lang-value'));
      var buttons = toggle.querySelectorAll('.lang-toggle-btn');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.toggle('active', buttons[i] === btn);
      }
    });

    // ── Task 5: canned-data pools for the two fake buttons ──
    // docs/system/DECISIONS.md: the only two canned/fake inputs in this
    // phase are the Signing screen's Stop button (stands in for the
    // classifier) and the Speaking screen's fake mic button (stands in for
    // real speech capture). Typed-and-Sent text is real data and never
    // drawn from either pool. Choice is uniform-random (any deterministic
    // or random choice was acceptable per the task brief); recorded here,
    // not re-litigated in docs/system/DECISIONS.md since the brief already
    // covers it as a non-decision.
    var SIGNED_CANNED_POOL = [
      'Hello, how are you?',
      'Thank you very much',
      'Nice to meet you',
      'I need help, please',
      'Yes, I understand'
    ];
    var SPOKEN_CANNED_POOL = [
      'Hi, how can I help you today?',
      'Sure, one moment please',
      'Thank you for waiting',
      'Yes, that sounds good',
      'Could you repeat that, please?'
    ];
    function pickCanned(pool) {
      return pool[Math.floor(Math.random() * pool.length)];
    }

    // ── Screen 03 — Signing ──
    // "Stop & Add to Conversation" stands in for the classifier's confirm
    // step (docs/system/DECISIONS.md's "two fake buttons" note). Canned
    // result, never appendBubble() directly — routes through the confirm
    // modal like every other path into the thread.
    document.getElementById('stop-signing-btn').addEventListener('click', function () {
      openModal('confirm', {
        label: 'You signed',
        text: pickCanned(SIGNED_CANNED_POOL),
        from: 'deaf'
      });
    });

    // ── Screen 04 — Speak or type ──
    // Real logic (not fake data, per this task's own scope note): Send stays
    // disabled until there is non-whitespace text in the field.
    (function () {
      var speakingInput = document.getElementById('speaking-input');
      var speakingSend = document.getElementById('speaking-send');
      speakingInput.addEventListener('input', function () {
        speakingSend.disabled = speakingInput.value.trim() === '';
      });

      // Fake mic button (Task 5) — stands in for real speech capture, which
      // doesn't exist this phase. Canned result, same pattern as the
      // signing screen's Stop button.
      document.getElementById('speaking-mic-btn').addEventListener('click', function () {
        openModal('confirm', {
          label: 'You said',
          text: pickCanned(SPOKEN_CANNED_POOL),
          from: 'hearing'
        });
      });

      // Send: REAL typed text (docs/system/DECISIONS.md — "typed-and-sent
      // messages are real data, not one of the two fake buttons"), never
      // drawn from SPOKEN_CANNED_POOL. Routes through the confirm modal like
      // every other path into the thread — Send itself never calls
      // appendBubble() directly. Field is cleared and Send re-disabled right
      // after handing the text off to the modal, so no stale text is left
      // in the field once the message has been (or is being) added; if the
      // person instead taps "Try again", they simply retype.
      speakingSend.addEventListener('click', function () {
        if (speakingSend.disabled) return;
        var typedText = speakingInput.value;
        openModal('confirm', {
          label: 'You said',
          text: typedText,
          from: 'hearing'
        });
        speakingInput.value = '';
        speakingSend.disabled = true;
      });
    })();

    // ── Fix 2 (step 5): wire .status-pill's TYPING state for real ──
    // README defines TYPING as exactly "keyboard is open." js/virtual-
    // keyboard.js sets/clears body.keyboard-active from its own internal
    // showKeyboard()/hideKeyboard() with no exposed hook or custom event
    // (see the comment on the "Virtual keyboard" CSS block above), so a
    // MutationObserver watching document.body's class attribute is the
    // simplest robust way to react to it without modifying that shared
    // script. Nothing else in this file drives .status-pill yet (its only
    // previous caller was the #dev-modal-switcher scaffold Fix 1 removed),
    // so unconditionally setting it here — 'typing' while the class is
    // present, null otherwise — cannot clobber some other intentional pill
    // state; if a future phase adds one, this observer will need to become
    // aware of it. LISTENING (camera-related) has no trigger in this
    // fake-data phase and is intentionally left undriven — there is no real
    // camera yet to be listening to.
    new MutationObserver(function () {
      setStatusPill(document.body.classList.contains('keyboard-active') ? 'typing' : null);
    }).observe(document.body, { attributes: true, attributeFilter: ['class'] });

    // ── Screen 05 — The conversation ──
    // Turn buttons hand control to the next screen; per
    // docs/system/DECISIONS.md, turn 2+ routes through here, not back
    // through screen 02.
    document.getElementById('turn-sign-btn').addEventListener('click', function () {
      showScreen('signing');
    });
    document.getElementById('turn-speak-btn').addEventListener('click', function () {
      showScreen('speaking');
    });
    // End Conversation: a real page load back to the dashboard, per
    // docs/system/DECISIONS.md ("End Conversation is a real page load back
    // to index.html, not a hide") — not a showScreen() call. Calls the
    // already-declared empty onEndConversation() hook first (a later phase
    // attaches camera/speech teardown there), then navigates for real.
    document.getElementById('end-conversation-btn').addEventListener('click', function () {
      onEndConversation();
      location.href = 'index.html';
    });

    // ── Task 6: idle timer ──
    // Page-level setTimeout, re-armed on any real input. Fires
    // openModal('idle', { seconds: 30 }) after IDLE_TIMEOUT_MS of silence;
    // does NOT re-arm itself on firing (a setTimeout only ever fires once) —
    // the next arm only happens via resetIdleTimer(), either from a real
    // input event or from the idle modal's own Continue button. This is what
    // keeps the modal's mere appearance from resetting the timer: opening it
    // happens from this callback, not from a listened event.
    var idleTimerId = null;

    function startIdleTimer() {
      idleTimerId = setTimeout(function () {
        // Fix 4: a modal (most importantly "confirm") can already be open
        // when this fires — e.g. someone reading the confirm card without
        // tapping anything for the full IDLE_TIMEOUT_MS, since nothing about
        // an open modal itself resets this timer. openModal('idle', ...)
        // unconditionally would overwrite .modal-card's content and
        // silently discard whatever was showing (recognised/typed text with
        // no way to recover it). If any modal is already open, leave its
        // content alone and just re-arm the timer to check again after
        // another full timeout, rather than firing over the top of it.
        if (document.body.classList.contains('modal-open')) {
          resetIdleTimer();
          return;
        }
        openModal('idle', { seconds: 30 });
      }, IDLE_TIMEOUT_MS);
    }

    function resetIdleTimer() {
      if (idleTimerId !== null) {
        clearTimeout(idleTimerId);
      }
      startIdleTimer();
    }

    // Any real input anywhere on the page re-arms the timer. Document-level
    // per the task brief, so it fires regardless of which screen/element is
    // under the pointer/keyboard — including taps on the idle modal's own
    // Continue/End Now buttons, which is intentional (Continue is supposed
    // to reset it; End Now navigates away before it matters).
    document.addEventListener('pointerdown', resetIdleTimer);
    document.addEventListener('keydown', resetIdleTimer);
    document.addEventListener('input', resetIdleTimer);

    startIdleTimer();
  </script>
</body>
</html>
