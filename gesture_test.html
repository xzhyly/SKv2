<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sining Kamay — Gesture Testing Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --panel: rgba(17, 24, 39, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #f97316;
      --primary-hover: #ea6a0a;
      --success: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(249, 115, 22, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
    }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 1.5rem; }
    header { text-align: center; margin-bottom: 0.5rem; }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(to right, #f97316, #fb923c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    p.subtitle { color: var(--text-muted); font-size: 1rem; }
    .main-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 1.5rem; }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .card-title { font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .camera-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #05070c;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    video { transform: scaleX(-1); }
    canvas { z-index: 10; transform: scaleX(-1); } /* Mirror canvas matching the video */
    .controls { display: flex; gap: 1rem; }
    button {
      flex: 1;
      padding: 0.85rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-start { background: var(--success); color: #090d16; }
    .btn-start:hover:not(:disabled) { background: #34d399; }
    .btn-stop { background: #27272a; color: var(--text); border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-stop:hover:not(:disabled) { background: #3f3f46; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .stats-list { display: flex; flex-direction: column; gap: 0.8rem; }
    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .stat-label { font-size: 0.85rem; color: var(--text-muted); }
    .stat-val { font-family: var(--font-mono); font-weight: 600; font-size: 0.95rem; }
    .stat-val.highlight { color: var(--primary); font-size: 1.1rem; }
    
    .console-log {
      flex: 1;
      background: #04060b;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 0.85rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      height: 150px;
      overflow-y: auto;
      color: #38bdf8;
    }
  </style>
  <script>
    // Force non-SIMD WebAssembly on Raspberry Pi to prevent "memory access out of bounds" crashes.
    if (!window._simdOverrideApplied) {
      window._simdOverrideApplied = true;
      const origValidate = WebAssembly.validate;
      WebAssembly.validate = function(buffer) {
        try {
          const bytes = new Uint8Array(buffer instanceof ArrayBuffer ? buffer : buffer.buffer || buffer);
          if (bytes.length < 1000) { // Only intercept the tiny SIMD support check buffer
            for (let i = 0; i < Math.min(bytes.length, 256); i++) {
              if (bytes[i] === 0xFD) {
                console.warn('SIMD WASM detected — forcing non-SIMD fallback for stability.');
                return false;
              }
            }
          }
        } catch(e) { /* ignore */ }
        return origValidate.call(WebAssembly, buffer);
      };
    }
  </script>
  <script src="js/lib/mediapipe/hands.js"></script>
</head>
<body>

<div class="container">
  <header>
    <h1>Sining Kamay — Gesture Testing Tool</h1>
    <p class="subtitle">Subukan ang MediaPipe detection at FPS sa Laptop o Raspberry Pi</p>
  </header>

  <div class="main-grid">
    <!-- Camera view and buttons -->
    <div class="card">
      <span class="card-title">Live Hand skeleton view</span>
      <div class="camera-wrapper">
        <video id="videoFeed" autoplay playsinline muted></video>
        <canvas id="canvasFeed"></canvas>
      </div>
      <div class="controls">
        <button class="btn-start" id="startBtn">Start Capture</button>
        <button class="btn-stop" id="stopBtn" disabled>Stop Capture</button>
      </div>
    </div>

    <!-- Stats and Logs -->
    <div class="card">
      <span class="card-title">Diagnostics</span>
      <div class="stats-list">
        <div class="stat-item">
          <span class="stat-label">System FPS:</span>
          <span class="stat-val highlight" id="fpsVal">0.0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Hand State:</span>
          <span class="stat-val" id="stateVal">No hand detected</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Index Tip (X, Y, Z):</span>
          <span class="stat-val" id="coordsVal">x: 0, y: 0, z: 0</span>
        </div>
      </div>
      <span class="card-title">Console Output</span>
      <div class="console-log" id="consoleBox">Ready. Click Start Capture.</div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('videoFeed');
  const canvas = document.getElementById('canvasFeed');
  const ctx = canvas.getContext('2d');
  
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const fpsVal = document.getElementById('fpsVal');
  const stateVal = document.getElementById('stateVal');
  const coordsVal = document.getElementById('coordsVal');
  const consoleBox = document.getElementById('consoleBox');

  let activeStream = null;
  let hands = null;
  let cameraLoop = null;
  let lastFrameTime = performance.now();
  let fpsHistory = [];

  // Downscaled offscreen canvas to optimize Pi CPU cycles
  const offscreenCanvas = document.createElement('canvas');
  offscreenCanvas.width = 320;
  offscreenCanvas.height = 240;
  const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

  function log(message, type = 'info') {
    const time = new Date().toTimeString().split(' ')[0];
    const prefix = type === 'warn' ? '⚠️ ' : type === 'error' ? '❌ ' : 'ℹ️ ';
    const logLine = `[${time}] ${prefix}${message}`;
    consoleBox.textContent += `\n${logLine}`;
    consoleBox.scrollTop = consoleBox.scrollHeight;
    console.log(logLine);
  }

  async function initMediaPipe() {
    if (!window.Hands) {
      log('MediaPipe Hands is not loaded! Check js/lib/mediapipe/hands.js path.', 'error');
      return false;
    }
    
    log('Initializing MediaPipe Hands...', 'info');
    hands = new window.Hands({
      locateFile: (file) => window.location.origin + '/Sining_kamay/js/lib/mediapipe/' + file
    });
    
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onResults);
    log('MediaPipe Hands initialized.', 'info');
    return true;
  }

  function calculateFPS() {
    const now = performance.now();
    const duration = now - lastFrameTime;
    lastFrameTime = now;
    if (duration > 0 && duration <= 500) {
      const currentFps = 1000 / duration;
      fpsHistory.push(currentFps);
      if (fpsHistory.length > 10) fpsHistory.shift();
      const avgFps = fpsHistory.reduce((a, b) => a + b, 0) / fpsHistory.length;
      fpsVal.textContent = avgFps.toFixed(1);
    }
  }

  // Draw landmarks and links on canvas
  function onResults(results) {
    if (!activeStream) return;
    calculateFPS();
    
    // Auto-scale drawing canvas to match wrapper bounding client size
    const bounds = canvas.getBoundingClientRect();
    if (canvas.width !== bounds.width || canvas.height !== bounds.height) {
      canvas.width = bounds.width;
      canvas.height = bounds.height;
    }
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const detectedHands = results.multiHandLandmarks || [];
    
    if (detectedHands.length === 0) {
      stateVal.textContent = 'No hand detected';
      coordsVal.textContent = 'x: 0, y: 0, z: 0';
      return;
    }

    stateVal.textContent = `${detectedHands.length} hand(s) detected`;
    
    // Draw landmarks
    detectedHands.forEach((landmarks) => {
      // Show Index Tip coordinates (landmark 8)
      const indexTip = landmarks[8];
      coordsVal.textContent = `x: ${indexTip.x.toFixed(3)}, y: ${indexTip.y.toFixed(3)}, z: ${indexTip.z.toFixed(3)}`;
      
      // Draw joint connections
      const connections = [
        [0, 1], [1, 2], [2, 3], [3, 4], // Thumb
        [0, 5], [5, 6], [6, 7], [7, 8], // Index
        [0, 9], [9, 10], [10, 11], [11, 12], // Middle
        [0, 13], [13, 14], [14, 15], [15, 16], // Ring
        [0, 17], [17, 18], [18, 19], [19, 20], // Pinky
        [5, 9], [9, 13], [13, 17] // Palm
      ];
      
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#10b981'; // green lines
      connections.forEach(([start, end]) => {
        const pt1 = landmarks[start];
        const pt2 = landmarks[end];
        ctx.beginPath();
        ctx.moveTo(pt1.x * canvas.width, pt1.y * canvas.height);
        ctx.lineTo(pt2.x * canvas.width, pt2.y * canvas.height);
        ctx.stroke();
      });
      
      // Draw joint dots
      ctx.fillStyle = '#ef4444'; // red dots
      landmarks.forEach((point) => {
        ctx.beginPath();
        ctx.arc(point.x * canvas.width, point.y * canvas.height, 6, 0, 2 * Math.PI);
        ctx.fill();
      });
    });
  }

  async function runCameraLoop() {
    if (!hands || !activeStream) return;
    if (video.readyState >= 2) {
      try {
        const sw = video.videoWidth;
        const sh = video.videoHeight;
        if (sw && sh) {
          const targetAspect = 4 / 3;
          const currentAspect = sw / sh;
          let sx = 0, sy = 0, sWidth = sw, sHeight = sh;
          if (currentAspect > targetAspect) {
            sWidth = sh * targetAspect;
            sx = (sw - sWidth) / 2;
          } else if (currentAspect < targetAspect) {
            sHeight = sw / targetAspect;
            sy = (sh - sHeight) / 2;
          }
          offscreenCtx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, 320, 240);
        } else {
          offscreenCtx.drawImage(video, 0, 0, 320, 240);
        }
        await hands.send({ image: offscreenCanvas });
      } catch (err) {
        log('MediaPipe send frame error: ' + err.message, 'error');
      }
    }
    cameraLoop = requestAnimationFrame(runCameraLoop);
  }

  async function startCapture() {
    log('Starting camera capture...', 'info');
    startBtn.disabled = true;

    if (!hands) {
      const ok = await initMediaPipe();
      if (!ok) {
        startBtn.disabled = false;
        return;
      }
    }

    try {
      activeStream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 640 }, height: { ideal: 480 } }
      });
      video.srcObject = activeStream;
      video.play().catch(e => log('Video play failed: ' + e.message, 'warn'));
      log('Webcam connected successfully.', 'info');
      
      stopBtn.disabled = false;
      lastFrameTime = performance.now();
      runCameraLoop();
    } catch (err) {
      log('Camera access failed: ' + err.message, 'error');
      startBtn.disabled = false;
    }
  }

  function stopCapture() {
    log('Stopping camera capture...', 'info');
    stopBtn.disabled = true;
    
    if (cameraLoop) {
      cancelAnimationFrame(cameraLoop);
      cameraLoop = null;
    }

    if (activeStream) {
      activeStream.getTracks().forEach(track => track.stop());
      activeStream = null;
    }
    video.srcObject = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    fpsVal.textContent = '0.0';
    stateVal.textContent = 'No hand detected';
    coordsVal.textContent = 'x: 0, y: 0, z: 0';
    
    startBtn.disabled = false;
    log('Capture stopped.', 'info');
  }

  startBtn.addEventListener('click', startCapture);
  stopBtn.addEventListener('click', stopCapture);
</script>

</body>
</html>
