<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sining Kamay Kiosk</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="prefetch" href="js/lib/tf.min.js" as="script">
    <link rel="prefetch" href="js/lib/mediapipe/hands.js" as="script">
    <link rel="prefetch" href="js/lib/mediapipe/hands_solution_wasm_bin.wasm" as="fetch" crossorigin="anonymous">
    <link rel="prefetch" href="js/lib/mediapipe/hands_solution_packed_assets.data" as="fetch" crossorigin="anonymous">
    <link rel="prefetch" href="js/lib/mediapipe/hand_landmark_full.tflite" as="fetch" crossorigin="anonymous">
    <link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/kiosk-touch.css">
<script src="js/kiosk-touch.js" defer></script>
    <link rel="stylesheet" href="css/sk-pages.css">
    <!-- Accounts (accounts-quiz phase): who is logged in (window.SK_ME), then the chip/menu code. -->
    <script src="php/api/me.php"></script>
    <script src="js/sk-account.js"></script>
</head>
<body>

    <!-- ══════════════════════════════════════ -->
    <!--   DASHBOARD PANE  (unchanged)         -->
    <!-- ══════════════════════════════════════ -->
    <main id="dashboard-pane" aria-label="Sining Kamay Welcome Screen">
        <header class="title-container">
            <div class="logo-and-title">
                <div class="sk-badge">SK</div>
                <h1 class="system-title">SINING KAMAY</h1>
            </div>
            <p class="system-subtitle">Filipino Sign Language System</p>
            <!-- Account area (accounts-quiz phase): "Log in" for a guest, else the name chip whose
                 menu holds the user's lists and, for an admin, every admin tool (Train Gestures and
                 View Reports are no longer dashboard cards). Drawn by js/sk-account.js. -->
            <div class="dash-acct" id="sk-acct"></div>
        </header>

        <div class="dashboard-content">
            <nav class="card-container" aria-label="Kiosk navigation">
                <!-- Learn Signs -->
                <a href="learn-signs.html" class="card-btn">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                        </svg>
                    </div>
                    <span class="card-label">Learn Signs</span>
                    <span class="card-caption">Practise FSL</span>
                </a>

                <!-- Let's Talk — docs/ui-target/README.md "01 — Dashboard": replaces
                     "Translate Sign to Text" and "Translate Text to Sign", orange 2px
                     border + orange icon so the eye lands on it first (the ONE orange
                     element on this screen — the other three stay plain). Points at
                     talk.html directly (a real page load, matching every other card's
                     own navigation, not a same-page reveal). -->
                <a href="talk.html" class="card-btn card-btn-highlight">
                    <div class="card-icon card-icon-highlight">
                        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                    </div>
                    <span class="card-label">Let's Talk</span>
                    <span class="card-caption">Talk with someone</span>
                </a>

                <!-- Quiz (accounts-quiz phase): for everyone; the score is saved only when logged in.
                     Orange icon, plain border, as in docs/design/dashboard-login-wireframe.html. -->
                <a href="quiz.html" class="card-btn">
                    <div class="card-icon card-icon-highlight">
                        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                            <path d="M8 9l2 2 4-4M8 16h8"></path>
                        </svg>
                    </div>
                    <span class="card-label">Quiz</span>
                    <span class="card-caption">Test what you learned</span>
                </a>
            </nav>

        </div>

        <footer class="dashboard-footer">
            <p class="footer-text">Filipino Sign Language kiosk for learning, translation, and gesture training.</p>
        </footer>
    </main>
    <script>SKAccount.renderAccount(document.getElementById('sk-acct'), { menu: true });</script>
</body>
</html>
