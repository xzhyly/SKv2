<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sining Kamay Kiosk</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/virtual-keyboard.css">
    <link rel="prefetch" href="js/lib/tf.min.js" as="script">
    <link rel="prefetch" href="js/lib/mediapipe/hands.js" as="script">
    <link rel="prefetch" href="js/lib/mediapipe/hands_solution_wasm_bin.wasm" as="fetch" crossorigin="anonymous">
    <link rel="prefetch" href="js/lib/mediapipe/hands_solution_packed_assets.data" as="fetch" crossorigin="anonymous">
    <link rel="prefetch" href="js/lib/mediapipe/hand_landmark_full.tflite" as="fetch" crossorigin="anonymous">
    <link rel="stylesheet" href="css/fonts.css">
    <style>
      /* ═══════════════════════════════════════════════
         TEXT TO SIGN — TRANSLATOR PANE (full redesign)
         ═══════════════════════════════════════════════ */
      #translator-pane {
        position: fixed !important;
        inset: 0 !important;           /* covers ALL edges — no yellow bleed */
        width: 100vw !important;
        height: 100vh !important;
        max-width: none !important;    /* CRITICAL: Overrides css/style.css max-width constraint */
        max-height: none !important;   /* CRITICAL: Overrides css/style.css max-height constraint */
        background: #f0f2f5;
        display: none;
        flex-direction: column;
        z-index: 600;
        font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      }

      /* ── Topbar ── */
      .tts-nav {
        height: 52px; flex-shrink: 0;
        background: #1a2540;
        border-bottom: 2px solid #f97316;
        display: flex; align-items: center;
        justify-content: space-between;
        padding: 0 20px; gap: 12px;
      }
      .tts-back {
        display: inline-flex; align-items: center; gap: 6px;
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.18);
        color: #fff; border-radius: 8px;
        padding: 0 14px; height: 34px;
        font-size: 13px; font-weight: 700;
        text-decoration: none; cursor: pointer;
        transition: background .18s;
      }
      .tts-back:active { background: rgba(255,255,255,.22); }
      .tts-back svg { width: 14px; height: 14px; flex-shrink: 0; }
      .tts-nav-title {
        display: flex; align-items: center; gap: 8px;
        color: #fff; font-size: 15px; font-weight: 800;
        letter-spacing: .07em;
      }
      .tts-nav-dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: #f97316;
      }
      .tts-mode-btn {
        display: inline-flex; align-items: center; gap: 7px;
        background: #f97316; color: #fff;
        border: none; border-radius: 8px;
        padding: 0 16px; height: 36px;
        font-size: 13px; font-weight: 700;
        text-decoration: none; cursor: pointer;
        transition: background .18s, transform .14s;
        white-space: nowrap;
      }
      .tts-mode-btn:active { background: #ea6a0a; }
      .tts-mode-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

      /* ── Page body ── */
      .tts-body {
        flex: 1; display: flex; min-height: 0; overflow: hidden;
        align-items: stretch; /* children must stretch to full height */
      }

      /* ── Controls panel (shared base) ── */
      .tts-controls-panel {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 28px 40px;
        gap: 16px;
      }

      /* INITIAL: full-width centered */
      .tts-body[data-state="initial"] .tts-controls-panel {
        width: 100%;
      }
      .tts-body[data-state="initial"] .tts-display-panel {
        display: none;
      }

      /* RESULT: left panel — fixed width, vertically centered content */
      .tts-body[data-state="result"] .tts-controls-panel {
        width: 380px; min-width: 320px; flex-shrink: 0;
        border-right: 1px solid #dde4ee;
        padding: 24px 28px;
        background: #ffffff; /* White sidebar for clean contrast */
        overflow: hidden;  /* no scroll, no overflow conflict */
        gap: 16px;
      }
      .tts-body[data-state="result"] .tts-display-panel {
        display: flex;
      }

      /* ── Mic button — overridden to force circle & bigger size ── */
      #translator-pane #start-btn {
        width: 140px !important;
        height: 140px !important;
        min-height: 140px !important;
        border-radius: 50% !important;
        background: #1a2540 !important;
        border: none !important;
        outline: none !important;
        -webkit-appearance: none;
        appearance: none;
        cursor: pointer !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        transition: transform .2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow .2s, background-color .2s !important;
        box-shadow: 0 8px 24px rgba(26,37,64,.28) !important;
        margin: 0 auto !important;
        padding: 0 !important;
        flex-shrink: 0 !important;
        /* Touchscreen stability settings */
        user-select: none !important;
        -webkit-user-select: none !important;
        -webkit-touch-callout: none !important;
        touch-action: none !important;
      }
      #translator-pane #start-btn:focus { outline: none !important; }
      #translator-pane #start-btn:focus-visible { outline: 3px solid rgba(249,115,22,.55) !important; outline-offset: 4px !important; }
      #translator-pane #start-btn:active {
        transform: scale(0.96) !important;
      }
      #translator-pane #start-btn.listening {
        background: #ef4444 !important;
        animation: micPulse 1.2s infinite !important;
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5) !important;
      }
      @keyframes micPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
        50%      { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
      }


      #translator-pane #start-btn svg {
        width: 52px !important;
        height: 52px !important;
        stroke: #ffffff !important;
        fill: none !important;
      }

      .tts-mic-label {
        font-size: 14px; font-weight: 700;
        color: #1a2540; margin: 0 !important;
      }

      /* ── Live transcript ── */
      .tts-live-text {
        width: 100%; max-width: 420px;
        font-size: 14px; font-weight: 600;
        color: #1a2540; text-align: center;
        line-height: 1.45;
        margin: 0 !important;
      }
      .tts-live-text:empty { display: none !important; }

      /* ── OR divider ── */
      .tts-or {
        display: flex; align-items: center; gap: 10px;
        color: #94a3b8; font-size: 12px; font-weight: 700;
        letter-spacing: .06em;
        width: 100%; max-width: 420px;
        margin: 0 !important;
      }
      .tts-or::before, .tts-or::after {
        content: ''; flex: 1; height: 1px; background: #dde4ee;
      }

      /* ── Text input ── */
      .tts-input {
        width: 100%; max-width: 420px; height: 50px;
        padding: 0 16px;
        border: 1.5px solid #e2e8f0; border-radius: 12px;
        background: #fff;
        font-size: 15px; font-weight: 500; color: #1e293b;
        outline: none; font-family: inherit;
        transition: border-color .18s, box-shadow .18s;
        margin: 0 !important;
      }
      .tts-input::placeholder { color: #b0bec5; }
      .tts-input:focus { border-color: #1a2540; box-shadow: 0 0 0 3px rgba(26,37,64,.1); }

      /* ── Translate button ── */
      #translator-pane #text-sign-btn {
        width: 100% !important; max-width: 420px !important;
        height: 50px !important;
        min-height: 50px !important; /* override global style.css min-height: 66px */
        border: none !important; border-radius: 12px !important;
        font-size: 15px !important; font-weight: 800 !important;
        cursor: pointer !important; font-family: inherit !important;
        display: flex !important; align-items: center !important;
        justify-content: center !important; gap: 8px !important;
        letter-spacing: .04em !important;
        transition: background .18s, transform .14s, box-shadow .18s !important;
        outline: none !important;
        margin: 0 !important;
      }
      #translator-pane #text-sign-btn:disabled {
        background: #e8ecf2 !important; color: #9aa5b4 !important; cursor: not-allowed !important;
        box-shadow: none !important; transform: none !important;
      }
      #translator-pane #text-sign-btn:not(:disabled) {
        background: #f97316 !important; color: #fff !important;
        box-shadow: 0 4px 14px rgba(249,115,22,.32) !important;
      }
      #translator-pane #text-sign-btn:not(:disabled):active {
        background: #ea6a0a !important;
      }
      #translator-pane #text-sign-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

      /* ── Sign display panel ── */
      .tts-display-panel {
        display: none; flex: 1;
        flex-direction: column;
        padding: 16px 20px;
        gap: 10px; min-width: 0;
        background: #f0f2f5;
      }
      .tts-display-header {
        display: flex; align-items: center;
        justify-content: space-between; flex-shrink: 0;
      }
      .tts-display-label {
        font-size: 11px; font-weight: 800;
        letter-spacing: .1em; text-transform: uppercase;
        color: #64748b;
      }
      .tts-reset-btn {
        height: 30px; padding: 0 14px;
        border: 1px solid #dde4ee; border-radius: 8px;
        background: #fff; color: #475569;
        font-size: 12px; font-weight: 700;
        cursor: pointer; font-family: inherit;
        transition: background .14s, border-color .14s;
        outline: none;
      }
      .tts-reset-btn:active { background: #f1f5f9; }

      /* ── Sign frame — override style.css #sign-container rules ── */
      .tts-sign-frame,
      #translator-pane #sign-container {
        flex: 1 !important; min-height: 0 !important;
        height: auto !important;
        background: #0d1520 !important;
        border: none !important;            /* remove dashed border from style.css */
        border-radius: 14px !important;
        overflow: hidden !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        box-shadow: 0 8px 32px rgba(0,0,0,.22) !important;
        padding: 0 !important;
      }
      #translator-pane #sign-container img,
      #translator-pane #sign-container video,
      .tts-sign-frame img,
      .tts-sign-frame video {
        max-width: 100%; max-height: 100%;
        object-fit: contain;
        display: block;
      }
      .tts-sign-placeholder {
        display: flex; flex-direction: column;
        align-items: center; gap: 14px;
      }
      .tts-sign-icon-wrap {
        width: 88px; height: 88px; border-radius: 50%;
        background: rgba(249,115,22,.16);
        border: 2px solid rgba(249,115,22,.35);
        display: flex; align-items: center;
        justify-content: center; font-size: 44px;
      }
      .tts-sign-placeholder p {
        font-size: 13px; font-weight: 600;
        color: rgba(255,255,255,.35); text-align: center;
      }

      /* ── Current word label ── */
      .tts-word-row {
        flex-shrink: 0; text-align: center; min-height: 26px;
      }
      #translator-pane #current-word {
        margin: 0 !important; font-size: 20px !important;
        font-weight: 800 !important; color: #1a2540 !important;
        font-family: 'Inter', 'Segoe UI', Arial, sans-serif !important;
      }

      /* ═══════════════════════════════════════════════
         KIOSK 1024×600 — compact result state
         ═══════════════════════════════════════════════ */
      @media screen and (max-height: 620px) {
        .tts-nav { height: 48px !important; }

        .tts-controls-panel {
          padding: 16px 24px !important;
          gap: 10px !important;
        }

        #translator-pane #start-btn {
          width: 100px !important;
          height: 100px !important;
          min-height: 100px !important;
        }
        #translator-pane #start-btn svg {
          width: 36px !important;
          height: 36px !important;
        }

        .tts-mic-label { font-size: 12px !important; }
        .tts-live-text { font-size: 12px !important; }
        .tts-or { font-size: 11px !important; }
        .tts-input { height: 38px !important; font-size: 13px !important; }
        
        #translator-pane #text-sign-btn {
          height: 38px !important;
          min-height: 38px !important;
          font-size: 13px !important;
        }

        /* Result: expand left panel for comfortable horizontal fit */
        .tts-body[data-state="result"] .tts-controls-panel {
          width: 380px !important; min-width: 340px !important;
          padding: 12px 20px !important;
          gap: 10px !important;
        }
        .tts-body[data-state="result"] #start-btn {
          width: 90px !important;
          height: 90px !important;
          min-height: 90px !important;
        }
        .tts-body[data-state="result"] #start-btn svg {
          width: 32px !important;
          height: 32px !important;
        }
        .tts-body[data-state="result"] .tts-mic-label { font-size: 11px !important; }
        .tts-body[data-state="result"] .tts-input { height: 36px !important; font-size: 13px !important; }
        .tts-body[data-state="result"] #text-sign-btn {
          height: 36px !important;
          min-height: 36px !important;
          font-size: 13px !important;
        }

        .tts-display-panel { padding: 12px 14px 12px 10px !important; gap: 8px !important; }
        .tts-word-row { min-height: 20px !important; }
        #translator-pane #current-word { font-size: 16px !important; }
        .tts-reset-btn { height: 26px !important; font-size: 11px !important; }
      }

      /* ── On-Screen Keyboard ── */
      .sk-keyboard-wrap {
        position: fixed;
        bottom: -320px; /* Hidden by default */
        left: 0;
        right: 0;
        height: 280px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1.5px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.4);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 12px 8px;
        gap: 8px;
        transition: bottom 0.05s ease-out;
      }
      .sk-keyboard-wrap.show {
        bottom: 0;
      }
      .sk-keyboard-row {
        display: flex;
        justify-content: center;
        width: 100%;
        gap: 6px;
      }
      .sk-key {
        height: 52px;
        flex: 1;
        max-width: 72px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
        transition: background-color 0.12s, transform 0.1s, border-color 0.12s;
        text-transform: lowercase; /* Default lowercase */
      }
      .sk-key.uppercase {
        text-transform: uppercase;
      }
      .sk-key:active {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(0.95);
      }
      .sk-key.ctrl {
        background: rgba(255, 255, 255, 0.04);
        font-size: 14px;
        font-weight: 700;
        max-width: 90px;
        color: #e2e8f0;
      }
      .sk-key.space {
        max-width: 320px;
        font-size: 15px;
      }
      .sk-key.action {
        background: #f97316;
        border-color: #f97316;
        color: #fff;
        max-width: 110px;
        font-size: 15px;
      }
      .sk-key.action:active {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(0.95);
      }
      .sk-key.close {
        background: rgba(239, 68, 68, 0.15);
        border-color: rgba(239, 68, 68, 0.3);
        color: #f87171;
        max-width: 80px;
        font-size: 14px;
      }
      .sk-key.close:active {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(0.95);
      }

      /* Keyboard Active State Layout Overrides
         js/virtual-keyboard.js puts .keyboard-active on <body> and <html>, never
         on #ttsBody. Below 1147px tall the open keyboard covers the text input or
         the Translate button, so while typing the speech controls are hidden and
         the rest moves to the top. The transcript is not listed: the
         .tts-live-text:empty rule already hides it while empty, and when it holds
         recognised speech it is what the user is retyping from.

         1146px is measured, not chosen: 1147px is the smallest viewport height
         at which the text input and the Translate button both clear the open
         keyboard without intervention (Translate bottom 867 = keyboard top 867;
         at 1146px it overlaps by 0.5px). Width does not affect it. Re-measure if
         the controls panel or keyboard height changes. See
         docs/system/UI-SURVEY-1024x600.md, finding 1. */
      @media screen and (max-height: 1146px) {
        body.keyboard-active #ttsBody #start-btn,
        body.keyboard-active #ttsBody .tts-mic-label,
        body.keyboard-active #ttsBody .tts-lang-toggle,
        body.keyboard-active #ttsBody .tts-or {
          display: none !important;
        }
        /* css/virtual-keyboard.css gives .tts-body min-height:100vh while the
           keyboard is open, which pushes this screen down; restore its resting size */
        body.keyboard-active #ttsBody {
          min-height: 0 !important;
          overflow-y: hidden !important;
        }
        body.keyboard-active #ttsBody .tts-controls-panel {
          justify-content: flex-start !important;
          padding-top: 30px !important;
          gap: 16px !important;
        }
      }

      /* At max-height 620px (kiosk 1024x600), scale keys slightly */
      @media screen and (max-height: 620px) {
        .sk-keyboard-wrap {
          height: 240px;
          bottom: -280px;
          padding: 8px 6px;
          gap: 6px;
        }
        .sk-keyboard-wrap.show {
          bottom: 0;
        }
        .sk-key {
          height: 44px;
          font-size: 16px;
          border-radius: 6px;
        }
        .sk-key.ctrl, .sk-key.space, .sk-key.action, .sk-key.close {
          font-size: 13px;
        }
        body.keyboard-active #ttsBody .tts-controls-panel {
          padding-top: 15px !important;
          gap: 10px !important;
        }
      }
      /* ── TTS Language Toggle ── */
      .tts-lang-toggle {
        display: flex;
        gap: 8px;
        justify-content: center;
        width: 100%;
        max-width: 420px;
        margin: 4px auto 0 !important;
      }
      .tts-lang-chip {
        flex: 1;
        height: 38px;
        border-radius: 8px;
        border: 1.5px solid #e2e8f0;
        background: #fff;
        color: #64748b;
        font-size: 12px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        transition: background .18s, border-color .18s, color .18s;
      }
      .tts-lang-chip.active {
        background: #1a2540;
        border-color: #1a2540;
        color: #fff;
      }
      .tts-lang-chip:active { background: #f1f5f9; }
    </style>
</head>
<body>

    <!-- ══════════════════════════════════════ -->
    <!--   DASHBOARD PANE  (unchanged)         -->
    <!-- ══════════════════════════════════════ -->
    <main id="dashboard-pane" aria-label="Sining Kamay Welcome Screen">
        <header class="title-container">
            <div class="logo-and-title">
                <div class="sk-badge">SK</div>
                <h1 class="system-title">SINING KAMAY</h1>
            </div>
            <p class="system-subtitle">Filipino Sign Language System</p>
        </header>

        <div class="dashboard-content">
            <nav class="card-container" aria-label="Kiosk navigation">
                <!-- Learn Signs -->
                <a href="learn-signs.html" class="card-btn">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                        </svg>
                    </div>
                    <span class="card-label">Learn Signs</span>
                    <span class="card-caption">Practise FSL</span>
                </a>

                <!-- Let's Talk — docs/ui-target/README.md "01 — Dashboard": replaces
                     "Translate Sign to Text" and "Translate Text to Sign", orange 2px
                     border + orange icon so the eye lands on it first (the ONE orange
                     element on this screen — the other three stay plain). Points at
                     talk.html directly (a real page load, matching every other card's
                     own navigation, not a same-page reveal). -->
                <a href="talk.html" class="card-btn card-btn-highlight">
                    <div class="card-icon card-icon-highlight">
                        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                    </div>
                    <span class="card-label">Let's Talk</span>
                    <span class="card-caption">Talk with someone</span>
                </a>

                <!-- Train Gestures -->
                <button type="button" class="card-btn" onclick="window.location.href='gesture-training.html'">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="8" y1="16" x2="16" y2="8" />
                            <path d="M5 14l5 5M4 15l5 5M15 4l5 5M14 5l5 5" />
                        </svg>
                    </div>
                    <span class="card-label">Train Gestures</span>
                    <span class="card-caption">Add new signs</span>
                </button>

                <!-- View Reports -->
                <button type="button" class="card-btn" onclick="window.location.href='reports.html'">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>
                    </div>
                    <span class="card-label">View Reports</span>
                    <span class="card-caption">Usage and accuracy</span>
                </button>
            </nav>

            <!-- js/script.js:13 unconditionally does
                 document.getElementById('welcome-btn').addEventListener(...)
                 with no null-guard, so removing this id entirely would throw
                 on every load. This dashboard change only removes the visible
                 "Translate Text to Sign" card; #translator-pane itself (and
                 its ?screen=voice URL entry point) is untouched, per this
                 change's own scope. Kept present-but-hidden instead, matching
                 the existing #status/#download-history-btn precedent just
                 below in #translator-pane for the same reason. -->
            <button id="welcome-btn" style="display:none" aria-hidden="true">Translate Text to Sign</button>
        </div>

        <footer class="dashboard-footer">
            <p class="footer-text">Filipino Sign Language kiosk for learning, translation, and gesture training.</p>
        </footer>
    </main>

                    <button type="button" class="tts-lang-chip" id="ttsLangFil" onclick="setTtsLanguage('fil-PH')">🇵🇭 Filipino</button>

    <script src="js/vosk.js" defer></script>
    <script src="js/script.js?v=5" defer></script>
    <script src="js/virtual-keyboard.js" defer></script>
    <script>
    // ═══════════════════════════════════════════════
    //  TEXT TO SIGN — State management & enhancements
    // ═══════════════════════════════════════════════
    (function () {
        const ttsBody      = document.getElementById('ttsBody');
        const micBtn       = document.getElementById('start-btn');
        const inputEl      = document.getElementById('text-sign-input');
        const translateBtn = document.getElementById('text-sign-btn');
        const resetBtn     = document.getElementById('ttsResetBtn');
        const transcriptEl = document.getElementById('transcript');
        const signCont     = document.getElementById('sign-container');
        const currentWord  = document.getElementById('current-word');

        // ── Enable / disable Translate button based on input ──
        inputEl.addEventListener('input', function () {
            translateBtn.disabled = !this.value.trim();
        });

        // ── Switch to result (split) state ──
        function switchToResult() {
            ttsBody.dataset.state = 'result';
        }

        // ── Intercept handleRecognizedText to trigger state switch on voice ──
        // js/script.js is now deferred (runs after parsing, before DOMContentLoaded),
        // so wait for DOMContentLoaded before patching a function it defines.
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof window.handleRecognizedText === 'function') {
                const _orig = window.handleRecognizedText;
                window.handleRecognizedText = function (text, onDone) {
                    if (text && text.trim()) {
                        transcriptEl.textContent = text;
                        switchToResult();
                    }
                    return _orig(text, onDone);
                };
            }
        });

        // ── Capture-phase listener on translate button ──
        //    Runs before script.js click handler so state switches first
        translateBtn.addEventListener('click', function () {
            if (inputEl.value.trim()) switchToResult();
        }, true);


        // ── Reset button ──
        resetBtn.addEventListener('click', function () {
            ttsBody.dataset.state = 'initial';
            signCont.innerHTML = `
                <div class="tts-sign-placeholder">
                    <div class="tts-sign-icon-wrap">🤟</div>
                    <p>Sign animation will play here</p>
                </div>`;
            currentWord.textContent = '';
            transcriptEl.textContent = '';
            inputEl.value = '';
            translateBtn.disabled = true;
            closeKeyboard();
        });

        // ── Redirect closeKeyboard to blur active input ──
        function closeKeyboard() {
            if (document.activeElement) {
                document.activeElement.blur();
            }
        }
    })();
    </script>
